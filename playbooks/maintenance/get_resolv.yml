- name: Show resolver configuration
  hosts: all_linux_systems
  gather_facts: false
  become: false
  tasks:
  - name: Read resolv.conf
    ansible.builtin.command:
      argv:
      - cat
      - /etc/resolv.conf
    register: resolv_result
    changed_when: false
    check_mode: false
  - name: Show the result
    ansible.builtin.debug:
      var: resolv_result.stdout_lines

- name: Resolverkonfiguration anzeigen
  hosts: all_linux_systems
  gather_facts: false
  become: false
  tasks:
  - name: resolv.conf lesen
    ansible.builtin.command:
      argv:
      - cat
      - /etc/resolv.conf
    register: resolv_result
    changed_when: false
    check_mode: false
  - name: Ergebnis anzeigen
    ansible.builtin.debug:
      var: resolv_result.stdout_lines

- name: Check HTTP availability
  hosts: all_linux_systems
  gather_facts: false
  become: false
  tasks:
  - name: Request the HTTPS endpoint
    ansible.builtin.uri:
      validate_certs: "{{ (tls_validate_certs | default({})).get('wan_check', tls_validate_certs_default | default(true)) | bool }}"
      url: '{{ wan_check_url | default(''https://example.com/'') }}'
      method: GET
      status_code:
      - 200
      - 301
      - 302
      timeout: 15
      return_content: false
    register: wan_result
    check_mode: false
  - name: Show the result
    ansible.builtin.debug:
      var: wan_result.status

- name: Remove managed rsyslog forwarding
  hosts: all_linux_systems
  gather_facts: false
  become: true
  pre_tasks:
  - name: Require an explicit target
    ansible.builtin.assert:
      that:
      - ansible_limit | default('') | length > 0
      fail_msg: Mit --limit HOST oder GRUPPE starten.
  - name: Check the feature flag
    ansible.builtin.assert:
      that:
      - features.rsyslog | default(false) | bool
  tasks:
  - name: Remove the managed drop-in
    ansible.builtin.file:
      path: /etc/rsyslog.d/90-remote-forwarding.conf
      state: absent
    register: syslog_change
  - name: Validate the rsyslog configuration
    ansible.builtin.command:
      argv:
      - rsyslogd
      - -N1
    changed_when: false
    when: syslog_change.changed and not ansible_check_mode
  - name: Restart rsyslog
    ansible.builtin.service:
      name: rsyslog
      state: restarted
    when: syslog_change.changed and not ansible_check_mode

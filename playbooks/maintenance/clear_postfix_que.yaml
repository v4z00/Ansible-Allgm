- name: Retry delivery of the Postfix queue
  hosts: all_linux_systems
  gather_facts: false
  become: true
  pre_tasks:
  - name: Require an explicit target
    ansible.builtin.assert:
      that:
      - ansible_limit | default('') | length > 0
      fail_msg: Mit --limit HOST oder GRUPPE starten.
  - name: Check the feature flag
    ansible.builtin.assert:
      that:
      - features.postfix | default(false) | bool
  tasks:
  - name: Flush the queue
    ansible.builtin.command:
      argv:
      - postqueue
      - -f
    when: not ansible_check_mode
    changed_when: true

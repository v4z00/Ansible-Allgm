---
- name: "Collect host fstab files for audit"
  hosts: all_linux_systems
  become: yes
  tasks:
    - name: "Create the local audit log directory"
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../x/reports/fstab_audit"
        state: directory
      delegate_to: localhost

    - name: "Fetch the host fstab file"
      ansible.builtin.fetch:
        src: /etc/fstab
        dest: "{{ playbook_dir }}/../../x/reports/fstab_audit/{{ inventory_hostname }}_fstab"
        flat: yes

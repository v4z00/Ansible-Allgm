- name: Uninstall Chrony
  hosts: all_linux_systems
  gather_facts: true
  become: true
  pre_tasks:
  - name: Require an explicit target
    ansible.builtin.assert:
      that:
      - ansible_limit | default('') | length > 0
      fail_msg: Mit --limit HOST oder GRUPPE starten.
  - name: Check the feature flag
    ansible.builtin.assert:
      that:
      - features.chrony | default(false) | bool
  tasks:
  - name: Remove only Chrony
    ansible.builtin.apt:
      name: chrony
      state: absent
      purge: false

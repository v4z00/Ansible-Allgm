- name: Chrony gezielt deinstallieren
  hosts: all_linux_systems
  gather_facts: true
  become: false
  pre_tasks:
  - name: Ausdrueckliches Ziel pruefen
    ansible.builtin.assert:
      that:
      - ansible_limit | default('') | length > 0
      fail_msg: Mit --limit HOST oder GRUPPE starten.
  - name: Feature pruefen
    ansible.builtin.assert:
      that:
      - features.chrony | default(false) | bool
  tasks:
  - name: Nur Chrony entfernen
    ansible.builtin.apt:
      name: chrony
      state: absent
      purge: false

- name: Update Debian packages
  hosts: all_linux_systems
  gather_facts: true
  serial: "{{ 1 if (host_updates_reboot | default(false) | bool) else '100%' }}"
  any_errors_fatal: "{{ host_updates_reboot | default(false) | bool }}"
  become: true
  pre_tasks:
  - name: Require an explicit target
    ansible.builtin.assert:
      that:
      - ansible_limit | default('') | length > 0
      fail_msg: Mit --limit HOST oder GRUPPE starten.
  tasks:
  - name: Validate the Debian target
    ansible.builtin.assert:
      that:
      - ansible_facts.os_family == 'Debian'
  - name: Update the package index and installed packages
    ansible.builtin.apt:
      update_cache: true
      upgrade: dist
      autoremove: true
      autoclean: true
  - name: Check for an optional reboot after package updates
    when: host_updates_reboot | default(false) | bool
    block:
    - name: Check for a pending reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: host_update_reboot_required
    - name: Reboot if required and wait for the host to return
      ansible.builtin.reboot:
        reboot_timeout: 600
        post_reboot_delay: 15
      when:
      - host_update_reboot_required.stat.exists | default(false) | bool
      - not ansible_check_mode

- name: Set configured service account passwords
  hosts: all_linux_systems
  gather_facts: false
  become: true
  pre_tasks:
  - name: Require an explicit target
    ansible.builtin.assert:
      that:
      - ansible_limit | default('') | length > 0
      fail_msg: Mit --limit HOST oder GRUPPE starten.
  tasks:
  - name: Validate configured password hashes
    ansible.builtin.assert:
      that:
      - item.name is match('^[a-z_][a-z0-9_-]*[$]?$')
      - item.password_hash is match('^[$](6|y|2[aby])[$]')
    loop: '{{ managed_service_passwords | default([]) }}'
    no_log: true
  - name: Update service accounts
    ansible.builtin.user:
      name: '{{ item.name }}'
      password: '{{ item.password_hash }}'
      update_password: always
    loop: '{{ managed_service_passwords | default([]) }}'
    no_log: true

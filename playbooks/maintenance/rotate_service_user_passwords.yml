- name: Konfigurierte Service-Passwoerter setzen
  hosts: all_linux_systems
  gather_facts: false
  become: false
  pre_tasks:
  - name: Ausdrueckliches Ziel pruefen
    ansible.builtin.assert:
      that:
      - ansible_limit | default('') | length > 0
      fail_msg: Mit --limit HOST oder GRUPPE starten.
  tasks:
  - name: Konfigurierte Passwort-Hashes pruefen
    ansible.builtin.assert:
      that:
      - item.name is match('^[a-z_][a-z0-9_-]*[$]?$')
      - item.password_hash is match('^[$](6|y|2[aby])[$]')
    loop: '{{ managed_service_passwords | default([]) }}'
    no_log: true
  - name: Service-Benutzer aktualisieren
    ansible.builtin.user:
      name: '{{ item.name }}'
      password: '{{ item.password_hash }}'
      update_password: always
    loop: '{{ managed_service_passwords | default([]) }}'
    no_log: true

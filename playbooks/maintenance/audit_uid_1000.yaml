- name: UID 1000 pruefen
  hosts: all_linux_systems
  gather_facts: false
  become: false
  tasks:
  - name: Benutzer abfragen
    ansible.builtin.command:
      argv:
      - getent
      - passwd
      - '1000'
    register: uid_result
    changed_when: false
    check_mode: false
    failed_when: uid_result.rc not in [0, 2]
  - name: Ergebnis anzeigen
    ansible.builtin.debug:
      var: uid_result.stdout_lines

- name: Create explicitly configured working directories
  hosts: all_linux_systems
  gather_facts: false
  become: true
  pre_tasks:
  - name: Require an explicit target
    ansible.builtin.assert:
      that:
      - ansible_limit | default('') | length > 0
      fail_msg: Mit --limit HOST oder GRUPPE starten.
  tasks:
  - name: Validate absolute paths
    ansible.builtin.assert:
      that:
      - item is match('^/')
      - item != '/'
      - '''/../'' not in item'
    loop: '{{ managed_working_directories | default([]) }}'
  - name: Create working directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0700'
    loop: '{{ managed_working_directories | default([]) }}'

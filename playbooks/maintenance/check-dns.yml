- name: Check DNS resolution
  hosts: all_linux_systems
  gather_facts: false
  become: false
  tasks:
  - name: Resolve the configured domains
    ansible.builtin.command:
      argv:
      - getent
      - ahosts
      - '{{ item }}'
    register: dns_result
    changed_when: false
    check_mode: false
    loop: '{{ dns_check_domains | default([''example.com'']) }}'
  - name: Show the result
    ansible.builtin.debug:
      var: dns_result.results

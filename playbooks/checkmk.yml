---
- name: Ensure the Checkmk folder hierarchy exists
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate the Checkmk API settings for folders
      ansible.builtin.assert:
        that:
          - checkmk_server_url | length > 0
          - checkmk_site | length > 0
          - checkmk_api_user | length > 0
          - checkmk_api_password | length > 0
        fail_msg: "CheckMK-API-Konfiguration ist unvollstaendig."
      no_log: true
      tags: [monitoring, checkmk, folders]

    - name: Create Checkmk folders and their parents
      checkmk.general.folder:
        validate_certs: "{{ (tls_validate_certs | default({})).get('checkmk_folders', tls_validate_certs_default | default(true)) | bool }}"
        server_url: "{{ checkmk_server_url }}"
        site: "{{ checkmk_site }}"
        automation_user: "{{ checkmk_api_user }}"
        automation_secret: "{{ checkmk_api_password }}"
        path: "{{ item.path }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ checkmk_folders }}"
      loop_control:
        label: "{{ item.path }}"
      no_log: true
      tags: [monitoring, checkmk, folders]

- name: Manage Checkmk agents and hosts
  hosts: checkmk_managed_hosts
  become: true
  gather_facts: true
  roles:
    - role: checkmk_agent
      when: features.checkmk | bool
      tags: [monitoring, checkmk]

- name: Register non-Linux hosts in Checkmk
  hosts: checkmk_inventory_hosts:!checkmk_managed_hosts
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Validate the API settings and target folder for manual hosts
      ansible.builtin.assert:
        that:
          - checkmk_server_url | length > 0
          - checkmk_site | length > 0
          - checkmk_api_user | length > 0
          - checkmk_api_password | length > 0
          - checkmk_target_folder | default(checkmk_default_folder) | length > 0
        fail_msg: "CheckMK-API-Konfiguration ist unvollstaendig."
      no_log: true
      tags: [monitoring, checkmk, manual_hosts]

  tasks:
    - name: Create the non-Linux host without attributes or ensure it is in the target folder
      delegate_to: localhost
      checkmk.general.host:
        validate_certs: "{{ (tls_validate_certs | default({})).get('checkmk_manual_host', tls_validate_certs_default | default(true)) | bool }}"
        server_url: "{{ checkmk_server_url }}"
        site: "{{ checkmk_site }}"
        automation_user: "{{ checkmk_api_user }}"
        automation_secret: "{{ checkmk_api_password }}"
        name: "{{ checkmk_hostname | default(inventory_hostname) }}"
        folder: "{{ checkmk_target_folder | default(checkmk_default_folder) }}"
        state: present
      no_log: true
      tags: [monitoring, checkmk, manual_hosts]

    - name: Report the Checkmk host requiring manual configuration
      ansible.builtin.debug:
        msg:
          - "Manuelle CheckMK-Konfiguration erforderlich"
          - "Inventory-Host: {{ inventory_hostname }}"
          - "CheckMK-Host: {{ checkmk_hostname | default(inventory_hostname) }}"
          - "Zielordner: {{ checkmk_target_folder | default(checkmk_default_folder) }}"
          - "Adresse: {{ ansible_host | default('nicht vorgegeben') }}"
          - "Attribute, Datenquellen, Spezialagenten und Plugins werden nicht durch Ansible geaendert."
          - "Nach der manuellen Konfiguration die offenen CheckMK-Aenderungen bewusst aktivieren."
      tags: [monitoring, checkmk, manual_hosts]

---
- name: Checkmk Agent entfernen
  hosts: all_linux_systems
  become: true

  tasks:
    - name: Checkmk Agent Socket stoppen, falls vorhanden
      ansible.builtin.systemd:
        name: check-mk-agent.socket
        state: stopped
        enabled: false
      failed_when: false

    - name: Checkmk Agent Service stoppen, falls vorhanden
      ansible.builtin.systemd:
        name: check-mk-agent.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Checkmk Agent Pakete entfernen
      ansible.builtin.apt:
        name:
          - check-mk-agent
          - checkmk-agent
        state: absent
        purge: true
      failed_when: false

    - name: Alte Checkmk Agent Verzeichnisse entfernen
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/check_mk
        - /usr/lib/check_mk_agent
        - /var/lib/check_mk_agent
        - /var/lib/cmk-agent
        - /var/lib/checkmk-agent
        - /var/log/check_mk_agent.log

    - name: Systemd neu laden
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Prüfen ob Checkmk Agent noch installiert ist
      ansible.builtin.shell: "dpkg -l | grep -Ei 'check-mk-agent|checkmk-agent' || true"
      register: checkmk_agent_packages
      changed_when: false

    - name: Ergebnis anzeigen
      ansible.builtin.debug:
        var: checkmk_agent_packages.stdout_lines

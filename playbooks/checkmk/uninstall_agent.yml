---
- name: Remove the Checkmk agent
  hosts: all_linux_systems
  become: true

  tasks:
    - name: Stop the Checkmk agent socket if present
      ansible.builtin.systemd:
        name: check-mk-agent.socket
        state: stopped
        enabled: false
      failed_when: false

    - name: Stop the Checkmk agent service if present
      ansible.builtin.systemd:
        name: check-mk-agent.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove Checkmk agent packages
      ansible.builtin.apt:
        name:
          - check-mk-agent
          - checkmk-agent
        state: absent
        purge: true
      failed_when: false

    - name: Remove obsolete Checkmk agent directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/check_mk
        - /usr/lib/check_mk_agent
        - /var/lib/check_mk_agent
        - /var/lib/cmk-agent
        - /var/lib/checkmk-agent
        - /var/log/check_mk_agent.log

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Check whether the Checkmk agent is still installed
      ansible.builtin.shell: "dpkg -l | grep -Ei 'check-mk-agent|checkmk-agent' || true"
      register: checkmk_agent_packages
      changed_when: false

    - name: Show the result
      ansible.builtin.debug:
        var: checkmk_agent_packages.stdout_lines

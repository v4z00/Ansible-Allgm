---
- name: Configure optional central services
  # Appliances such as OPNsense must never receive Linux roles, even if the
  # dynamic inventory is stale or classifies them incorrectly.
  hosts: all_linux_systems:!opnsense_firewall
  become: true
  gather_facts: true
  roles:
    - role: postfix
      when: features.postfix | bool
      tags: [optional, postfix]
    - role: kerberos
      when: features.kerberos | bool
      tags: [optional, kerberos, identity]

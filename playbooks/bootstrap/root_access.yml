---
- name: Prepare root access
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    selected_target: "{{ bootstrap_target | default('all') }}"

  tasks:
    - name: Require configured bootstrap profiles
      ansible.builtin.assert:
        that: bootstrap_targets | default([]) | length > 0
        fail_msg: >-
          Keine bootstrap_targets konfiguriert. Erstzugangsprofile in
          group_vars/all/settings.yml hinterlegen.

    - name: Require the selected bootstrap profile
      ansible.builtin.assert:
        that: >-
          selected_target == 'all'
          or selected_target in (bootstrap_targets | map(attribute='name') | list)
        fail_msg: "Unbekanntes Bootstrap-Ziel: {{ selected_target }}"

    - name: Check the controller key
      ansible.builtin.stat:
        path: "{{ bootstrap_public_key_file }}"
      register: bootstrap_key

    - name: Require the controller key
      ansible.builtin.assert:
        that: bootstrap_key.stat.exists
        fail_msg: "Controller-Key fehlt: {{ bootstrap_public_key_file }}"

    - name: Validate selected bootstrap profiles
      ansible.builtin.assert:
        that:
          - hostvars[item.name] is defined
          - hostvars[item.name].ansible_host is defined
          - item.become_method | default('auto') in ['auto', 'sudo', 'su', 'direct']
        fail_msg: "Inventory-Ziel oder Become-Methode fuer {{ item.name }} ist ungueltig."
      loop: "{{ bootstrap_targets | default([]) }}"
      when: selected_target == 'all' or item.name == selected_target

    - name: Prepare root key access or individual bootstrap credentials
      ansible.builtin.include_tasks: tasks/prepare_target.yml
      loop: "{{ bootstrap_targets | default([]) }}"
      loop_control:
        loop_var: bootstrap_entry
        label: "{{ bootstrap_entry.name }}"
      when: selected_target == 'all' or bootstrap_entry.name == selected_target

- name: Establish root access with sudo or su
  hosts: bootstrap_runtime
  gather_facts: false

  tasks:
    - name: Test the initial connection
      ansible.builtin.ping:

    - name: Test sudo access to root
      ansible.builtin.command: whoami
      become: true
      become_method: sudo
      become_user: root
      register: bootstrap_sudo_test
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - ansible_user != 'root'
        - bootstrap_requested_become in ['auto', 'sudo']

    - name: Test su access to root
      ansible.builtin.command: whoami
      become: true
      become_method: su
      become_user: root
      register: bootstrap_su_test
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - ansible_user != 'root'
        - bootstrap_requested_become in ['auto', 'su']

    - name: Select a working privilege escalation method
      ansible.builtin.set_fact:
        bootstrap_selected_become: >-
          {{
            'direct'
            if ansible_user == 'root' or bootstrap_requested_become == 'direct'
            else (
              bootstrap_requested_become
              if bootstrap_requested_become == 'sudo'
                and bootstrap_sudo_test.rc | default(1) == 0
                and bootstrap_sudo_test.stdout | default('') == 'root'
              else (
                bootstrap_requested_become
                if bootstrap_requested_become == 'su'
                  and bootstrap_su_test.rc | default(1) == 0
                  and bootstrap_su_test.stdout | default('') == 'root'
                else (
                  'sudo'
                  if bootstrap_requested_become == 'auto'
                    and bootstrap_sudo_test.rc | default(1) == 0
                    and bootstrap_sudo_test.stdout | default('') == 'root'
                  else (
                    'su'
                    if bootstrap_requested_become == 'auto'
                      and bootstrap_su_test.rc | default(1) == 0
                      and bootstrap_su_test.stdout | default('') == 'root'
                    else 'none'
                  )
                )
              )
            )
          }}

    - name: Stop if privilege escalation to root fails
      ansible.builtin.assert:
        that: bootstrap_selected_become != 'none'
        fail_msg: >-
          Weder direkter Root-Zugang, sudo noch su funktioniert fuer
          {{ bootstrap_inventory_name }}.
          Angefordert war {{ bootstrap_requested_become }}. Bei abweichendem
          Root-Passwort become_password_env separat konfigurieren.

    - name: Configure root key access
      become: "{{ bootstrap_selected_become != 'direct' }}"
      become_user: root
      become_method: "{{ bootstrap_selected_become if bootstrap_selected_become != 'direct' else 'sudo' }}"
      block:
        - name: Create the root SSH directory
          ansible.builtin.file:
            path: /root/.ssh
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Install the controller key for root
          ansible.posix.authorized_key:
            user: root
            key: "{{ lookup('ansible.builtin.file', bootstrap_public_key_file) }}"
            state: present
            manage_dir: false
          no_log: true

        - name: Enable SSH key authentication for root
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/00-managed-root-key-bootstrap.conf
            owner: root
            group: root
            mode: "0644"
            content: |
              # Managed by Ansible
              PermitRootLogin prohibit-password
              PubkeyAuthentication yes

        - name: Validate the SSH configuration
          ansible.builtin.command: sshd -t
          changed_when: false

        - name: Reload SSH
          ansible.builtin.service:
            name: ssh
            state: reloaded

    - name: Report the privilege escalation method
      ansible.builtin.debug:
        msg: "{{ bootstrap_inventory_name }}: Root-Key ueber {{ bootstrap_selected_become }} eingerichtet."

- name: Confirm existing root key access
  hosts: bootstrap_key_ready
  gather_facts: false

  tasks:
    - name: Test the root key connection with Ansible
      ansible.builtin.ping:

    - name: Report existing root key access
      ansible.builtin.debug:
        msg: "{{ bootstrap_inventory_name }}: Root-Key funktioniert bereits; kein Bootstrap notwendig."

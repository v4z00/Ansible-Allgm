---
- name: Deploy Telegraf
  hosts: all_linux_systems
  become: true
  pre_tasks:
    - name: Require the Telegraf feature
      ansible.builtin.assert:
        that: features.telegraf | bool
        fail_msg: "features.telegraf ist deaktiviert. Fuer einen bewussten Rollout zuerst in settings.yml aktivieren."

  tasks:
    - name: Install repository prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
        state: present
        update_cache: true

    - name: Create keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download the InfluxData repository key
      ansible.builtin.get_url:
        validate_certs: "{{ (tls_validate_certs | default({})).get('telegraf_repository_key', tls_validate_certs_default | default(true)) | bool }}"
        url: "{{ influx_key_url }}"
        dest: /tmp/influxdata-archive.key
        mode: '0600'

    - name: Read the InfluxData key fingerprint
      ansible.builtin.command:
        argv:
          - gpg
          - --show-keys
          - --with-colons
          - /tmp/influxdata-archive.key
      register: influx_key_details
      changed_when: false

    - name: Verify the InfluxData key against the expected fingerprint
      ansible.builtin.assert:
        that:
          - "('fpr:::::::::' ~ influx_key_fpr ~ ':') in influx_key_details.stdout"
        fail_msg: "Der InfluxData-Schluessel besitzt nicht den erwarteten Fingerabdruck."

    - name: Install the verified InfluxData key
      ansible.builtin.command:
        argv:
          - gpg
          - --dearmor
          - --yes
          - --output
          - /etc/apt/keyrings/influxdata-archive.gpg
          - /tmp/influxdata-archive.key
      changed_when: true

    - name: Ensure correct permissions on the key
      ansible.builtin.file:
        path: /etc/apt/keyrings/influxdata-archive.gpg
        mode: '0644'
        owner: root
        group: root

    - name: Add InfluxData Repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/influxdata.list
        content: >-
          deb [signed-by=/etc/apt/keyrings/influxdata-archive.gpg]
          {{ influx_repository_url }} {{ influx_repository_suite }}
          {{ influx_repository_component }}
        mode: '0644'

    - name: Install Telegraf
      ansible.builtin.apt:
        name: telegraf
        state: present
        update_cache: yes

    - name: Deploy Telegraf Configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/monitoring/telegraf.conf.j2"
        dest: /etc/telegraf/telegraf.conf
        owner: root
        group: telegraf
        mode: '0640'
      notify: restart_telegraf

    - name: Remove the downloaded repository key
      ansible.builtin.file:
        path: /tmp/influxdata-archive.key
        state: absent

    - name: Force restart Telegraf
      ansible.builtin.service:
        name: telegraf
        state: restarted

  handlers:
    - name: restart_telegraf
      ansible.builtin.service:
        name: telegraf
        state: restarted

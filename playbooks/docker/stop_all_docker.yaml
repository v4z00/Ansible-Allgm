- name: "PLAY 1: Alle Docker Compose Stacks stoppen"
  hosts: docker_deployment_hosts
  become: yes
  gather_facts: no

  tasks:
    - name: "TASK 1.1: Alle laufenden Compose-Projekte abrufen"
      # Verwendet 'docker compose ls --format json', um Name und ConfigFiles zu bekommen
      ansible.builtin.command: "docker compose ls --format json"
      register: running_projects_raw
      changed_when: false
      failed_when: false

    - name: "TASK 1.2: Laufende Compose-Projekte stoppen"
      vars:
        compose_file: "{{ (item.ConfigFiles | string).split(',')[0] }}"
      ansible.builtin.command:
        argv:
          # Ansible expandiert Umgebungsvariablen in chdir. env -C übernimmt den Pfad wörtlich.
          - /usr/bin/env
          - -C
          - "{{ compose_file | dirname }}"
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - stop
        expand_argument_vars: false
      loop: "{{ (running_projects_raw.stdout | default('') | trim or '[]') | from_json }}"
      loop_control:
        label: "{{ item.Name }}"
      register: stop_result
      # Ignoriere Fehler, da einige Stacks möglicherweise schon stoppen
      ignore_errors: true
      # Compose kann Fortschrittsmeldungen auch auf stderr schreiben.
      changed_when: '"Stopping" in stop_result.stdout or "Stopping" in stop_result.stderr'

    - name: "TASK 1.3: Zusammenfassung der Stopp-Aktion"
      ansible.builtin.debug:
        msg: "Die Stopp-Aktion wurde versucht. Prüfen Sie die Host-Logs für Details."

- name: "PLAY 1: Stop all Docker Compose stacks"
  hosts: docker_deployment_hosts
  become: yes
  gather_facts: no

  tasks:
    - name: "TASK 1.1: List running Compose projects"
      # Read project names and config files from 'docker compose ls --format json'.
      ansible.builtin.command: "docker compose ls --format json"
      register: running_projects_raw
      changed_when: false
      failed_when: false

    - name: "TASK 1.2: Stop running Compose projects"
      vars:
        compose_file: "{{ (item.ConfigFiles | string).split(',')[0] }}"
      ansible.builtin.command:
        argv:
          # Ansible expands environment variables in chdir. env -C preserves the literal path.
          - /usr/bin/env
          - -C
          - "{{ compose_file | dirname }}"
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - stop
        expand_argument_vars: false
      loop: "{{ (running_projects_raw.stdout | default('') | trim or '[]') | from_json }}"
      loop_control:
        label: "{{ item.Name }}"
      register: stop_result
      # A stack may already be stopping.
      ignore_errors: true
      # Compose may write progress messages to stderr.
      changed_when: '"Stopping" in stop_result.stdout or "Stopping" in stop_result.stderr'

    - name: "TASK 1.3: Summarize the stopped stacks"
      ansible.builtin.debug:
        msg: "Die Stopp-Aktion wurde versucht. Prüfen Sie die Host-Logs für Details."

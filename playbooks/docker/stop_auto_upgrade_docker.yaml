---
- name: Hold Docker package versions during unattended upgrades
  hosts: docker_deployment_hosts
  become: true

  tasks:
    - name: Hold Docker packages
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-compose-plugin
        - docker-ce-rootless-extras

    # Reload systemd after updating package holds.
    - name: Reload the systemd manager
      ansible.builtin.systemd:
        daemon_reexec: yes

# ==============================================================================
# PLAY 1: Prepare the deployment
# ==============================================================================
- name: "PLAY 1: Prepare the deployment"
  hosts: docker_deployment_hosts
  vars_files: [vars/paths.yml]
  become: yes
  gather_facts: no

  tasks:
    - name: "TASK 1.1: Initialize deployment results"
      ansible.builtin.set_fact:
        deployment_results: []
        pruned_stacks: []
        prune_candidates: []
        problem_containers: []
        expected_container_names: []
        final_running_containers: []

    - name: "TASK 1.2: Validate base variables"
      ansible.builtin.assert:
        that:
          - _docker_local_config_dir is string and _docker_local_config_dir is abs
          - _docker_remote_config_dir is string and _docker_remote_config_dir is abs
          - compose_file_patterns is defined
          - hostvars['localhost'].global_prune_confirmation is undefined
        fail_msg: "Configure absolute Docker paths and compose_file_patterns. The orphan confirmation must come from the terminal."
        success_msg: "Base variables are set."


# ==============================================================================
# PLAY 2: Detect orphan stacks
# ==============================================================================
- name: "PLAY 2: Find unmanaged Docker stacks"
  hosts: docker_deployment_hosts
  vars_files: [vars/paths.yml]
  become: yes
  gather_facts: no

  tasks:
    - name: "TASK 2.1: Find managed Compose files for this host on the controller"
      delegate_to: localhost
      ansible.builtin.find:
        paths: "{{ _docker_local_config_dir }}/{{ inventory_hostname }}"
        patterns: "{{ compose_file_patterns }}"
        recurse: yes
      register: local_compose_projects
      failed_when: local_compose_projects is failed or local_compose_projects.skipped_paths | default({}) | length > 0

    - name: "TASK 2.2: Collect managed Compose project names"
      ansible.builtin.set_fact:
        managed_project_names: >-
          {{
            local_compose_projects.files
            | default([])
            | map(attribute='path')
            | map('dirname')
            | map('basename')
            | list
            | unique
          }}

    - name: "TASK 2.3: List running Compose projects on the host"
      ansible.builtin.command: "docker compose ls --format json"
      register: running_projects_raw
      changed_when: false
      failed_when: false

    - name: "TASK 2.4: Parse running Compose projects"
      ansible.builtin.set_fact:
        running_projects: >-
          {{
            (running_projects_raw.stdout | default('[]') | from_json)
            if (running_projects_raw.stdout | default('') | trim | length > 0)
            else []
          }}

    - name: "TASK 2.5: Initialize orphan stack candidates"
      ansible.builtin.set_fact:
        prune_candidates: []

    - name: "TASK 2.6: Collect orphan stacks by project name"
      ansible.builtin.set_fact:
        prune_candidates: "{{ prune_candidates + [item] }}"
      loop: "{{ running_projects }}"
      when:
        - item.Name is defined
        - item.ConfigFiles is defined
        - item.ConfigFiles | string | trim | length > 0
        - item.Name not in managed_project_names

    - name: "TASK 2.7: Show orphan stack candidates"
      ansible.builtin.debug:
        msg: |
          {% if prune_candidates | length > 0 %}
          Unmanaged Compose projects on {{ inventory_hostname }}:

          {% for item in prune_candidates %}
          - {{ item.Name }}
            Compose: {{ (item.ConfigFiles | string).split(',')[0] }}
            Path:    {{ ((item.ConfigFiles | string).split(',')[0]) | dirname }}
            Status:  {{ item.Status | default('unknown') }}

          {% endfor %}
          {% else %}
          No orphan stacks on {{ inventory_hostname }}.
          {% endif %}


# ==============================================================================
# PLAY 2.5: Confirm orphan stack removal on the controller
# ==============================================================================
- name: "PLAY 2.5: Confirm orphan stack removal on the controller"
  hosts: localhost
  gather_facts: no
  connection: local

  any_errors_fatal: true
  tasks:
    - name: "Reject a preset orphan confirmation"
      ansible.builtin.assert:
        that: global_prune_confirmation is undefined
        fail_msg: "A preset orphan confirmation is invalid. Answer the removal prompt at the terminal."

    - name: "TASK 2.5.1: Count orphan stack candidates across hosts"
      ansible.builtin.set_fact:
        global_prune_candidate_count: >-
          {{
            groups['docker_deployment_hosts']
            | map('extract', hostvars, 'prune_candidates')
            | select('defined')
            | flatten
            | length
          }}

    - name: "TASK 2.5.2: Ask for confirmation before removing orphan stacks"
      ansible.builtin.pause:
        prompt: |

          ==============================================================
          Warning: orphan stacks found
          ==============================================================

          The following Compose projects are no longer managed locally:

          {% for target_host in groups['docker_deployment_hosts'] %}
          {% set items = hostvars[target_host].prune_candidates | default([]) %}
          {% if items | length > 0 %}
          Host: {{ target_host }}

          {% for item in items %}
          - {{ item.Name }}
            Compose: {{ (item.ConfigFiles | string).split(',')[0] }}
            Path:    {{ ((item.ConfigFiles | string).split(',')[0]) | dirname }}
            Status:  {{ item.Status | default('unknown') }}

          {% endfor %}
          {% endif %}
          {% endfor %}

          Total orphan stacks: {{ global_prune_candidate_count }}

          The following command will run for each stack:
            docker compose down --remove-orphans

          If the Compose file is missing on the remote host, these Docker Compose labels are used for cleanup:
            - Containers labelled com.docker.compose.project
            - Networks labelled com.docker.compose.project

          Type exactly "yes" to remove these stacks.
          Any other answer skips removal.
          ==============================================================
      register: global_prune_confirmation
      when: global_prune_candidate_count | int > 0

    - name: "TASK 2.5.3: Record the global prune decision"
      ansible.builtin.set_fact:
        global_prune_confirmed: "{{ global_prune_confirmation.user_input | default('') == 'yes' }}"


# ==============================================================================
# PLAY 2.6: Remove confirmed orphan stacks
# ==============================================================================
- name: "PLAY 2.6: Remove confirmed orphan stacks"
  hosts: docker_deployment_hosts
  become: yes
  gather_facts: no

  tasks:
    - name: "TASK 2.6.1: Remove orphan stacks"
      ansible.builtin.shell: |
        set -e

        PROJECT_NAME={{ item.Name | quote }}
        COMPOSE_FILE={{ (item.ConfigFiles | string).split(',')[0] | quote }}
        PROJECT_DIR="$(dirname "$COMPOSE_FILE")"

        echo "Removing orphan stack: $PROJECT_NAME"
        echo "Compose file: $COMPOSE_FILE"
        echo "Project path:   $PROJECT_DIR"

        if [ -f "$COMPOSE_FILE" ]; then
          echo "Compose file found. Running docker compose down."
          cd "$PROJECT_DIR"
          docker compose -f "$COMPOSE_FILE" down --remove-orphans
        else
          echo "Compose file missing. Cleaning up by Docker Compose labels."

          CONTAINERS="$(docker ps -aq --filter "label=com.docker.compose.project=$PROJECT_NAME" || true)"
          NETWORKS="$(docker network ls -q --filter "label=com.docker.compose.project=$PROJECT_NAME" || true)"

          if [ -n "$CONTAINERS" ]; then
            echo "Removing containers:"
            echo "$CONTAINERS"
            docker rm -f $CONTAINERS
          else
            echo "No containers found for project $PROJECT_NAME."
          fi

          if [ -n "$NETWORKS" ]; then
            echo "Removing networks:"
            echo "$NETWORKS"
            docker network rm $NETWORKS || true
          else
            echo "No networks found for project $PROJECT_NAME."
          fi
        fi
      loop: "{{ prune_candidates | default([]) }}"
      when:
        - prune_candidates | default([]) | length > 0
        - hostvars['localhost'].global_prune_confirmed | default(false)
        - (hostvars['localhost'].global_prune_confirmation | default({})).get('user_input', '') == 'yes'
      register: prune_result
      failed_when: prune_result.rc != 0
      changed_when: true

    - name: "TASK 2.6.2: Record the cleanup result"
      ansible.builtin.set_fact:
        pruned_stacks: >-
          {{
            prune_result.results
            | default([])
            | selectattr('changed', 'defined')
            | selectattr('changed')
            | selectattr('item', 'defined')
            | map(attribute='item')
            | selectattr('Name', 'defined')
            | map(attribute='Name')
            | list
          }}

    - name: "TASK 2.6.3: Show the stacks removed"
      ansible.builtin.debug:
        msg: |
          {% if pruned_stacks | default([]) | length > 0 %}
          Orphan stacks removed from {{ inventory_hostname }}:
          {% for stack in pruned_stacks %}
          - {{ stack }}
          {% endfor %}
          {% elif prune_candidates | default([]) | length > 0 and not hostvars['localhost'].global_prune_confirmed | default(false) %}
          Orphan stacks found. Removal was not confirmed.
          {% elif prune_candidates | default([]) | length > 0 %}
          Orphan stacks found. No stacks were removed from {{ inventory_hostname }}.
          {% else %}
          No orphan stacks on {{ inventory_hostname }}.
          {% endif %}


# ==============================================================================
# PLAY 3: Synchronize configuration
# ==============================================================================
- name: "PLAY 3: Synchronize configuration"
  hosts: docker_deployment_hosts
  vars_files: [vars/paths.yml]
  become: yes
  gather_facts: no

  tasks:
    - name: "TASK 3.1: Create the target directory"
      ansible.builtin.file:
        path: "{{ _docker_remote_config_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: '0770'
        owner: root
        group: root

    - name: "TASK 3.2: Synchronize project directories"
      ansible.posix.synchronize:
        src: "{{ _docker_local_config_dir }}/{{ inventory_hostname }}/"
        dest: "{{ _docker_remote_config_dir }}/{{ inventory_hostname }}/"
        dest_port: "{{ (managed_host_access | default({})).get(inventory_hostname, {}).get('port', managed_access_default_port | default(22)) | int }}"
        delete: yes
        archive: yes
      delegate_to: localhost

    - name: "TASK 3.3: Find Compose projects on the target host"
      ansible.builtin.find:
        paths: "{{ _docker_remote_config_dir }}/{{ inventory_hostname }}"
        patterns: "{{ compose_file_patterns }}"
        recurse: yes
      register: all_compose_projects

    - name: "TASK 3.4: Check whether any Compose projects were found"
      ansible.builtin.assert:
        that:
          - all_compose_projects.files | default([]) | length > 0
        fail_msg: "No Compose files found on {{ inventory_hostname }}."
        success_msg: "Compose files found on {{ inventory_hostname }}."


# ==============================================================================
# PLAY 4: Apply file permissions before deployment
# ==============================================================================
- name: "PLAY 4: Set file permissions from host_vars before deployment"
  hosts: docker_deployment_hosts
  vars_files: [vars/paths.yml]
  become: true
  gather_facts: false

  vars:
    host_docker_file_permissions: "{{ docker_file_permissions | default([]) }}"

  tasks:
    - name: "TASK 4.1: Validate file rules"
      ansible.builtin.assert:
        that:
          - item.path is defined
          - item.path | string | length > 0
          - (item.absolute | default(false) | bool and item.path | string is match('^/')) or (not (item.absolute | default(false) | bool) and not (item.path | string is match('^/')))
          - "'..' not in item.path.split('/')"
          - item.mode is defined
        fail_msg: "Invalid docker_file_permissions rule on {{ inventory_hostname }}: {{ item }}"
      loop: "{{ host_docker_file_permissions }}"
      loop_control:
        label: "{{ item.path | default('unnamed') }}"

    - name: "TASK 4.2: Check target paths"
      ansible.builtin.stat:
        path: "{{ item.path if item.absolute | default(false) | bool else _docker_remote_config_dir ~ '/' ~ inventory_hostname ~ '/' ~ item.path }}"
      loop: "{{ host_docker_file_permissions }}"
      loop_control:
        label: "{{ item.path }}"
      register: docker_permission_paths

    - name: "TASK 4.3: Apply configured file permissions"
      ansible.builtin.file:
        path: "{{ item.item.path if item.item.absolute | default(false) | bool else _docker_remote_config_dir ~ '/' ~ inventory_hostname ~ '/' ~ item.item.path }}"
        state: "{{ 'directory' if item.item.create | default(false) | bool else omit }}"
        owner: "{{ item.item.owner | default(omit) }}"
        group: "{{ item.item.group | default(omit) }}"
        mode: "{{ item.item.mode }}"
        recurse: "{{ item.item.recurse | default(false) }}"
      loop: "{{ docker_permission_paths.results | default([]) }}"
      when:
        - item.stat.exists | default(false) or item.item.create | default(false) | bool
      loop_control:
        label: "{{ item.item.path }}"


# ==============================================================================
# PLAY 6: Deploy stacks
# ==============================================================================
- name: "PLAY 6: Deploy Docker stacks"
  hosts: docker_deployment_hosts
  become: yes
  gather_facts: no

  vars:
    critical_stacks: "{{ docker_critical_stacks | default([]) }}"

  tasks:
    - name: "TASK 6.1: Select critical Compose projects"
      ansible.builtin.set_fact:
        critical_compose_projects: >-
          {{
            hostvars[inventory_hostname].all_compose_projects.files
            | default([])
            | selectattr('path', 'defined')
            | selectattr('path', 'string')
            | list
          }}

    - name: "TASK 6.2: Select standard Compose projects"
      ansible.builtin.set_fact:
        standard_compose_projects: >-
          {{
            hostvars[inventory_hostname].all_compose_projects.files
            | default([])
            | selectattr('path', 'defined')
            | selectattr('path', 'string')
            | list
          }}

    - name: "TASK 6.3: Deploy critical stacks"
      ansible.builtin.shell: |
        set -e
        echo "Starting critical stack: {{ item.path | dirname }}"
        cd "{{ item.path | dirname }}"
        docker compose up -d --remove-orphans
      args:
        chdir: "{{ item.path | dirname }}"
      loop: "{{ critical_compose_projects }}"
      when: item.path | dirname | basename in critical_stacks
      register: critical_deploy
      failed_when: critical_deploy.rc != 0
      changed_when: true

    - name: "TASK 6.4: Wait for base services"
      ansible.builtin.pause:
        seconds: 15
        prompt: "Waiting for critical services to start."
      when:
        - critical_deploy is defined
        - critical_deploy.results | default([]) | length > 0

    - name: "TASK 6.5: Deploy standard stacks"
      ansible.builtin.shell: |
        set -e
        echo "Starting standard stack: {{ item.path | dirname }}"
        cd "{{ item.path | dirname }}"
        docker compose up -d --remove-orphans
      args:
        chdir: "{{ item.path | dirname }}"
      loop: "{{ standard_compose_projects }}"
      when: item.path | dirname | basename not in critical_stacks
      register: standard_deploy
      failed_when: standard_deploy.rc != 0
      changed_when: true

    - name: "TASK 6.6: Combine deployment results"
      ansible.builtin.set_fact:
        deployment_results: >-
          {{
            deployment_results
            + (critical_deploy.results | default([]))
            + (standard_deploy.results | default([]))
          }}


# ==============================================================================
# PLAY 7: Check container health
# ==============================================================================
- name: "PLAY 7: Check container health"
  hosts: docker_deployment_hosts
  become: yes
  gather_facts: no

  tasks:
    - name: "TASK 7.1: Read Compose files"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ hostvars[inventory_hostname].all_compose_projects.files | default([]) }}"
      register: slurped_compose_files
      failed_when: false

    - name: "TASK 7.2: Determine expected container names"
      ansible.builtin.set_fact:
        expected_container_names: >-
          {{
            slurped_compose_files.results
            | default([])
            | rejectattr('failed', 'equalto', true)
            | map(attribute='content')
            | select('defined')
            | map('b64decode')
            | map('from_yaml')
            | select('defined')
            | selectattr('services', 'defined')
            | map(attribute='services')
            | map('dict2items')
            | flatten
            | map(attribute='value')
            | selectattr('container_name', 'defined')
            | map(attribute='container_name')
            | list
            | unique
          }}

    - name: "TASK 7.3: Report when no explicit container names are configured"
      ansible.builtin.debug:
        msg: |
          No explicit container_name values on {{ inventory_hostname }}.
          Only explicitly named containers can be checked individually.
      when: expected_container_names | length == 0

    - name: "TASK 7.4: Wait for all explicitly named containers to start"
      ansible.builtin.shell: "docker ps --format '{{ '{{' }}.Names{{ '}}' }}'"
      register: running_containers_raw
      until: expected_container_names | difference(running_containers_raw.stdout_lines | default([])) | length == 0
      retries: "{{ wait_retries | default(10) }}"
      delay: "{{ wait_retry_delay | default(5) }}"
      changed_when: false
      failed_when: false
      when: expected_container_names | length > 0

    - name: "TASK 7.5: Record container status"
      ansible.builtin.set_fact:
        final_running_containers: "{{ running_containers_raw.stdout_lines | default([]) }}"
        problem_containers: "{{ expected_container_names | difference(running_containers_raw.stdout_lines | default([])) }}"

    - name: "TASK 7.6: Show unhealthy or missing containers"
      ansible.builtin.debug:
        msg: |
          {% if problem_containers | length > 0 %}
          Expected containers missing from {{ inventory_hostname }}:
          {% for container in problem_containers %}
          - {{ container }}
          {% endfor %}
          {% else %}
          All expected named containers are running on {{ inventory_hostname }}.
          {% endif %}

# ==============================================================================
# PLAY 8: Aggregate results across hosts
# ==============================================================================
- name: "PLAY 8: Aggregate results across hosts"
  hosts: localhost
  gather_facts: no
  connection: local

  tasks:
    - name: "TASK 8.1: Collect deployment results from all hosts"
      ansible.builtin.set_fact:
        global_deployment_results: >-
          {{
            groups['docker_deployment_hosts']
            | map('extract', hostvars, 'deployment_results')
            | select('defined')
            | flatten
          }}
        global_pruned_stacks: >-
          {{
            groups['docker_deployment_hosts']
            | map('extract', hostvars, 'pruned_stacks')
            | select('defined')
            | flatten
          }}
        global_prune_candidates: >-
          {{
            groups['docker_deployment_hosts']
            | map('extract', hostvars, 'prune_candidates')
            | select('defined')
            | flatten
          }}
        global_problem_containers: >-
          {{
            groups['docker_deployment_hosts']
            | map('extract', hostvars, 'problem_containers')
            | select('defined')
            | flatten
          }}
# ==============================================================================
# PLAY 9: Write the deployment summary and log
# ==============================================================================
- name: "PLAY 9: Write the deployment summary and log"
  hosts: localhost
  vars_files: [vars/paths.yml]
  connection: local
  gather_facts: yes

  vars:
    log_dir: "{{ _docker_reports_dir }}/docker"
    log_file: "{{ log_dir }}/deployment-{{ ansible_date_time.iso8601_basic_short }}.log"

  tasks:
    - name: "TASK 9.1: Create the log directory"
      ansible.builtin.file:
        path: "{{ log_dir }}"
        state: directory
        mode: '0755'

    - name: "TASK 9.2: Generate the deployment summary"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/summary_templates.j2"
        dest: "{{ log_file }}"
        mode: '0644'

    - name: "TASK 9.3: Display the deployment summary and wait for acknowledgement"
      tags: [controller_docker_summary_ack]
      ansible.builtin.pause:
        prompt: |
          Deployment summary (log contents):
          {{ lookup('file', log_file) }}
          Press Enter to continue.
      when: docker_deploy_pause_summary | default(true) | bool

    - name: Report the deployment summary without waiting
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.file', log_file) }}"
      when: not (docker_deploy_pause_summary | default(true) | bool)

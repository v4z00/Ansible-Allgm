# ==============================================================================
# PLAY 1: Vorbereitung
# ==============================================================================
- name: "PLAY 1: Vorbereitung"
  hosts: docker_deployment_hosts
  become: yes
  gather_facts: no

  tasks:
    - name: "TASK 1.1: Ergebnislisten initialisieren"
      ansible.builtin.set_fact:
        deployment_results: []
        pruned_stacks: []
        prune_candidates: []
        problem_containers: []
        expected_container_names: []
        final_running_containers: []

    - name: "TASK 1.2: Basisvariablen prüfen"
      ansible.builtin.assert:
        that:
          - local_base_dir is defined
          - remote_base_dir is defined
          - compose_file_patterns is defined
        fail_msg: "local_base_dir, remote_base_dir oder compose_file_patterns nicht definiert!"
        success_msg: "Basisvariablen sind korrekt definiert."


# ==============================================================================
# PLAY 2: Waisen-Stacks erkennen
# ==============================================================================
- name: "PLAY 2: Nicht mehr verwaltete Docker Stacks erkennen"
  hosts: docker_deployment_hosts
  become: yes
  gather_facts: no

  tasks:
    - name: "TASK 2.1: Verwaltete Compose-Dateien für diesen Host auf Management-Host finden"
      delegate_to: localhost
      ansible.builtin.find:
        paths: "{{ local_base_dir }}/{{ inventory_hostname }}"
        patterns: "{{ compose_file_patterns }}"
        recurse: yes
      register: local_compose_projects
      failed_when: false

    - name: "TASK 2.2: Liste verwalteter Compose-Projektnamen erstellen"
      ansible.builtin.set_fact:
        managed_project_names: >-
          {{
            local_compose_projects.files
            | default([])
            | map(attribute='path')
            | map('dirname')
            | map('basename')
            | list
            | unique
          }}

    - name: "TASK 2.3: Laufende Compose-Projekte auf Host abrufen"
      ansible.builtin.command: "docker compose ls --format json"
      register: running_projects_raw
      changed_when: false
      failed_when: false

    - name: "TASK 2.4: Laufende Compose-Projekte parsen"
      ansible.builtin.set_fact:
        running_projects: >-
          {{
            (running_projects_raw.stdout | default('[]') | from_json)
            if (running_projects_raw.stdout | default('') | trim | length > 0)
            else []
          }}

    - name: "TASK 2.5: Waisen-Stack-Kandidatenliste initialisieren"
      ansible.builtin.set_fact:
        prune_candidates: []

    - name: "TASK 2.6: Waisen-Stacks per Projektname sammeln"
      ansible.builtin.set_fact:
        prune_candidates: "{{ prune_candidates + [item] }}"
      loop: "{{ running_projects }}"
      when:
        - item.Name is defined
        - item.ConfigFiles is defined
        - item.ConfigFiles | string | trim | length > 0
        - item.Name not in managed_project_names

    - name: "TASK 2.7: Gefundene Waisen-Stacks anzeigen"
      ansible.builtin.debug:
        msg: |
          {% if prune_candidates | length > 0 %}
          Auf Host {{ inventory_hostname }} wurden folgende nicht mehr verwaltete Docker-Compose-Projekte gefunden:

          {% for item in prune_candidates %}
          - {{ item.Name }}
            Compose: {{ (item.ConfigFiles | string).split(',')[0] }}
            Pfad:    {{ ((item.ConfigFiles | string).split(',')[0]) | dirname }}
            Status:  {{ item.Status | default('unbekannt') }}

          {% endfor %}
          {% else %}
          Auf Host {{ inventory_hostname }} wurden keine Waisen-Stacks gefunden.
          {% endif %}


# ==============================================================================
# PLAY 2.5: Lokale Sicherheitsabfrage für Waisen-Stacks
# ==============================================================================
- name: "PLAY 2.5: Lokale Bestätigung für Waisen-Stack-Bereinigung"
  hosts: localhost
  gather_facts: no
  connection: local

  tasks:
    - name: "TASK 2.5.1: Globale Waisen-Stack-Anzahl berechnen"
      ansible.builtin.set_fact:
        global_prune_candidate_count: >-
          {{
            groups['docker_deployment_hosts']
            | map('extract', hostvars, 'prune_candidates')
            | select('defined')
            | flatten
            | length
          }}

    - name: "TASK 2.5.2: Waisen-Stacks lokal auf Management-Host bestätigen"
      ansible.builtin.pause:
        prompt: |

          ==============================================================
          ACHTUNG: Waisen-Stacks gefunden
          ==============================================================

          Folgende Docker-Compose-Projekte werden nicht mehr lokal verwaltet:

          {% for target_host in groups['docker_deployment_hosts'] %}
          {% set items = hostvars[target_host].prune_candidates | default([]) %}
          {% if items | length > 0 %}
          Host: {{ target_host }}

          {% for item in items %}
          - {{ item.Name }}
            Compose: {{ (item.ConfigFiles | string).split(',')[0] }}
            Pfad:    {{ ((item.ConfigFiles | string).split(',')[0]) | dirname }}
            Status:  {{ item.Status | default('unbekannt') }}

          {% endfor %}
          {% endif %}
          {% endfor %}

          Insgesamt: {{ global_prune_candidate_count }} Waisen-Stack(s)

          Das führt pro Stack aus:
            docker compose down --remove-orphans

          Falls die alte Compose-Datei remote bereits fehlt, wird per Docker-Compose-Labels aufgeräumt:
            - Container mit Label com.docker.compose.project
            - Netzwerke mit Label com.docker.compose.project

          Tippe exakt "yes", um die Bereinigung auszuführen.
          Alles andere überspringt die Bereinigung.
          ==============================================================
      register: global_prune_confirmation
      when: global_prune_candidate_count | int > 0

    - name: "TASK 2.5.3: Globale Prune-Bestätigung speichern"
      ansible.builtin.set_fact:
        global_prune_confirmed: "{{ global_prune_confirmation.user_input | default('') == 'yes' }}"


# ==============================================================================
# PLAY 2.6: Bestätigte Waisen-Stacks entfernen
# ==============================================================================
- name: "PLAY 2.6: Bestätigte Waisen-Stacks entfernen"
  hosts: docker_deployment_hosts
  become: yes
  gather_facts: no

  tasks:
    - name: "TASK 2.6.1: Waisen-Stacks entfernen"
      ansible.builtin.shell: |
        set -e

        PROJECT_NAME="{{ item.Name }}"
        COMPOSE_FILE="{{ (item.ConfigFiles | string).split(',')[0] }}"
        PROJECT_DIR="$(dirname "$COMPOSE_FILE")"

        echo "Entferne Waisen-Stack: $PROJECT_NAME"
        echo "Compose-Datei: $COMPOSE_FILE"
        echo "Projektpfad:   $PROJECT_DIR"

        if [ -f "$COMPOSE_FILE" ]; then
          echo "Compose-Datei existiert. Nutze docker compose down."
          cd "$PROJECT_DIR"
          docker compose -f "$COMPOSE_FILE" down --remove-orphans
        else
          echo "Compose-Datei fehlt. Räume anhand Docker-Compose-Labels auf."

          CONTAINERS="$(docker ps -aq --filter "label=com.docker.compose.project=$PROJECT_NAME" || true)"
          NETWORKS="$(docker network ls -q --filter "label=com.docker.compose.project=$PROJECT_NAME" || true)"

          if [ -n "$CONTAINERS" ]; then
            echo "Entferne Container:"
            echo "$CONTAINERS"
            docker rm -f $CONTAINERS
          else
            echo "Keine Container für Projekt $PROJECT_NAME gefunden."
          fi

          if [ -n "$NETWORKS" ]; then
            echo "Entferne Netzwerke:"
            echo "$NETWORKS"
            docker network rm $NETWORKS || true
          else
            echo "Keine Netzwerke für Projekt $PROJECT_NAME gefunden."
          fi
        fi
      loop: "{{ prune_candidates | default([]) }}"
      when:
        - prune_candidates | default([]) | length > 0
        - hostvars['localhost'].global_prune_confirmed | default(false)
      register: prune_result
      failed_when: prune_result.rc != 0
      changed_when: true

    - name: "TASK 2.6.2: Bereinigungsergebnis speichern"
      ansible.builtin.set_fact:
        pruned_stacks: >-
          {{
            prune_result.results
            | default([])
            | selectattr('changed', 'defined')
            | selectattr('changed')
            | selectattr('item', 'defined')
            | map(attribute='item')
            | selectattr('Name', 'defined')
            | map(attribute='Name')
            | list
          }}

    - name: "TASK 2.6.3: Bereinigte Stacks anzeigen"
      ansible.builtin.debug:
        msg: |
          {% if pruned_stacks | default([]) | length > 0 %}
          Bereinigte Waisen-Stacks auf {{ inventory_hostname }}:
          {% for stack in pruned_stacks %}
          - {{ stack }}
          {% endfor %}
          {% elif prune_candidates | default([]) | length > 0 and not hostvars['localhost'].global_prune_confirmed | default(false) %}
          Waisen-Stacks gefunden, aber Bereinigung wurde lokal nicht bestätigt.
          {% elif prune_candidates | default([]) | length > 0 %}
          Waisen-Stacks gefunden, aber auf {{ inventory_hostname }} wurde nichts entfernt.
          {% else %}
          Keine Waisen-Stacks auf {{ inventory_hostname }} gefunden.
          {% endif %}


# ==============================================================================
# PLAY 3: Konfiguration synchronisieren
# ==============================================================================
- name: "PLAY 3: Konfiguration synchronisieren"
  hosts: docker_deployment_hosts
  become: yes
  gather_facts: no

  tasks:
    - name: "TASK 3.1: Sicherstellen, dass das Zielverzeichnis existiert"
      ansible.builtin.file:
        path: "{{ remote_base_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: '0770'
        owner: root
        group: root

    - name: "TASK 3.2: Projektverzeichnisse synchronisieren"
      ansible.posix.synchronize:
        src: "{{ local_base_dir }}/{{ inventory_hostname }}/"
        dest: "{{ remote_base_dir }}/{{ inventory_hostname }}/"
        dest_port: "{{ (managed_host_access | default({})).get(inventory_hostname, {}).get('port', managed_access_default_port | default(22)) | int }}"
        delete: yes
        archive: yes
      delegate_to: localhost

    - name: "TASK 3.3: Compose-Projekte auf Zielsystem finden"
      ansible.builtin.find:
        paths: "{{ remote_base_dir }}/{{ inventory_hostname }}"
        patterns: "{{ compose_file_patterns }}"
        recurse: yes
      register: all_compose_projects

    - name: "TASK 3.4: Prüfen, ob Compose-Projekte gefunden wurden"
      ansible.builtin.assert:
        that:
          - all_compose_projects.files | default([]) | length > 0
        fail_msg: "Keine Compose-Dateien auf {{ inventory_hostname }} gefunden!"
        success_msg: "Compose-Dateien auf {{ inventory_hostname }} gefunden."


# ==============================================================================
# PLAY 4: Nachbereitungs-Tasks VOR Deployment
# ==============================================================================
- name: "PLAY 4: Dateirechte aus host_vars vor Deployment setzen"
  hosts: docker_deployment_hosts
  become: true
  gather_facts: false

  vars:
    host_docker_file_permissions: "{{ docker_file_permissions | default([]) }}"

  tasks:
    - name: "TASK 4.1: Dateiregeln validieren"
      ansible.builtin.assert:
        that:
          - item.path is defined
          - item.path | string | length > 0
          - (item.absolute | default(false) | bool and item.path | string is match('^/')) or (not (item.absolute | default(false) | bool) and not (item.path | string is match('^/')))
          - "'..' not in item.path.split('/')"
          - item.mode is defined
        fail_msg: "Ungueltige docker_file_permissions-Regel auf {{ inventory_hostname }}: {{ item }}"
      loop: "{{ host_docker_file_permissions }}"
      loop_control:
        label: "{{ item.path | default('unbenannt') }}"

    - name: "TASK 4.2: Zielpfade pruefen"
      ansible.builtin.stat:
        path: "{{ item.path if item.absolute | default(false) | bool else remote_base_dir ~ '/' ~ inventory_hostname ~ '/' ~ item.path }}"
      loop: "{{ host_docker_file_permissions }}"
      loop_control:
        label: "{{ item.path }}"
      register: docker_permission_paths

    - name: "TASK 4.3: Konfigurierte Dateirechte anwenden"
      ansible.builtin.file:
        path: "{{ item.item.path if item.item.absolute | default(false) | bool else remote_base_dir ~ '/' ~ inventory_hostname ~ '/' ~ item.item.path }}"
        state: "{{ 'directory' if item.item.create | default(false) | bool else omit }}"
        owner: "{{ item.item.owner | default(omit) }}"
        group: "{{ item.item.group | default(omit) }}"
        mode: "{{ item.item.mode }}"
        recurse: "{{ item.item.recurse | default(false) }}"
      loop: "{{ docker_permission_paths.results | default([]) }}"
      when:
        - item.stat.exists | default(false) or item.item.create | default(false) | bool
      loop_control:
        label: "{{ item.item.path }}"


# ==============================================================================
# PLAY 6: Stacks deployen
# ==============================================================================
- name: "PLAY 6: Docker Stacks deployen"
  hosts: docker_deployment_hosts
  become: yes
  gather_facts: no

  vars:
    critical_stacks: "{{ docker_critical_stacks | default([]) }}"

  tasks:
    - name: "TASK 6.1: Kritische Compose-Projekte bestimmen"
      ansible.builtin.set_fact:
        critical_compose_projects: >-
          {{
            hostvars[inventory_hostname].all_compose_projects.files
            | default([])
            | selectattr('path', 'defined')
            | selectattr('path', 'string')
            | list
          }}

    - name: "TASK 6.2: Standard Compose-Projekte bestimmen"
      ansible.builtin.set_fact:
        standard_compose_projects: >-
          {{
            hostvars[inventory_hostname].all_compose_projects.files
            | default([])
            | selectattr('path', 'defined')
            | selectattr('path', 'string')
            | list
          }}

    - name: "TASK 6.3: Kritische Stacks deployen"
      ansible.builtin.shell: |
        set -e
        echo "Starte kritischen Stack: {{ item.path | dirname }}"
        cd "{{ item.path | dirname }}"
        docker compose up -d --remove-orphans
      args:
        chdir: "{{ item.path | dirname }}"
      loop: "{{ critical_compose_projects }}"
      when: item.path | dirname | basename in critical_stacks
      register: critical_deploy
      failed_when: critical_deploy.rc != 0
      changed_when: true

    - name: "TASK 6.4: Warte kurz auf Basisdienste"
      ansible.builtin.pause:
        seconds: 15
        prompt: "Kurze Pause, damit kritische Basisdienste sauber starten können :)"
      when:
        - critical_deploy is defined
        - critical_deploy.results | default([]) | length > 0

    - name: "TASK 6.5: Standard-Stacks deployen"
      ansible.builtin.shell: |
        set -e
        echo "Starte Standard-Stack: {{ item.path | dirname }}"
        cd "{{ item.path | dirname }}"
        docker compose up -d --remove-orphans
      args:
        chdir: "{{ item.path | dirname }}"
      loop: "{{ standard_compose_projects }}"
      when: item.path | dirname | basename not in critical_stacks
      register: standard_deploy
      failed_when: standard_deploy.rc != 0
      changed_when: true

    - name: "TASK 6.6: Deployment-Ergebnisse zusammenführen"
      ansible.builtin.set_fact:
        deployment_results: >-
          {{
            deployment_results
            + (critical_deploy.results | default([]))
            + (standard_deploy.results | default([]))
          }}


# ==============================================================================
# PLAY 7: Intelligenter Health Check
# ==============================================================================
- name: "PLAY 7: Intelligenter Health Check"
  hosts: docker_deployment_hosts
  become: yes
  gather_facts: no

  tasks:
    - name: "TASK 7.1: Compose-Dateien einlesen"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ hostvars[inventory_hostname].all_compose_projects.files | default([]) }}"
      register: slurped_compose_files
      failed_when: false

    - name: "TASK 7.2: Erwartete Container-Namen ermitteln"
      ansible.builtin.set_fact:
        expected_container_names: >-
          {{
            slurped_compose_files.results
            | default([])
            | rejectattr('failed', 'equalto', true)
            | map(attribute='content')
            | select('defined')
            | map('b64decode')
            | map('from_yaml')
            | select('defined')
            | selectattr('services', 'defined')
            | map(attribute='services')
            | map('dict2items')
            | flatten
            | map(attribute='value')
            | selectattr('container_name', 'defined')
            | map(attribute='container_name')
            | list
            | unique
          }}

    - name: "TASK 7.3: Hinweis, falls keine container_name-Werte gefunden wurden"
      ansible.builtin.debug:
        msg: |
          Hinweis: Auf {{ inventory_hostname }} wurden keine expliziten container_name-Werte gefunden.
          Der Health Check kann dann nur eingeschränkt prüfen.
      when: expected_container_names | length == 0

    - name: "TASK 7.4: Auf Start aller explizit benannten Container warten"
      ansible.builtin.shell: "docker ps --format '{{ '{{' }}.Names{{ '}}' }}'"
      register: running_containers_raw
      until: expected_container_names | difference(running_containers_raw.stdout_lines | default([])) | length == 0
      retries: "{{ wait_retries | default(10) }}"
      delay: "{{ wait_retry_delay | default(5) }}"
      changed_when: false
      failed_when: false
      when: expected_container_names | length > 0

    - name: "TASK 7.5: Containerstatus speichern"
      ansible.builtin.set_fact:
        final_running_containers: "{{ running_containers_raw.stdout_lines | default([]) }}"
        problem_containers: "{{ expected_container_names | difference(running_containers_raw.stdout_lines | default([])) }}"

    - name: "TASK 7.6: Problematische Container anzeigen"
      ansible.builtin.debug:
        msg: |
          {% if problem_containers | length > 0 %}
          Auf {{ inventory_hostname }} fehlen folgende erwartete Container:
          {% for container in problem_containers %}
          - {{ container }}
          {% endfor %}
          {% else %}
          Alle erwarteten explizit benannten Container laufen auf {{ inventory_hostname }}.
          {% endif %}

# ==============================================================================
# PLAY 8: Globale Ergebnisse aggregieren
# ==============================================================================
- name: "PLAY 8: Globale Ergebnisse aggregieren"
  hosts: localhost
  gather_facts: no
  connection: local

  tasks:
    - name: "TASK 8.1: Deployment-Ergebnisse von allen Hosts sammeln"
      ansible.builtin.set_fact:
        global_deployment_results: >-
          {{
            groups['docker_deployment_hosts']
            | map('extract', hostvars, 'deployment_results')
            | select('defined')
            | flatten
          }}
        global_pruned_stacks: >-
          {{
            groups['docker_deployment_hosts']
            | map('extract', hostvars, 'pruned_stacks')
            | select('defined')
            | flatten
          }}
        global_prune_candidates: >-
          {{
            groups['docker_deployment_hosts']
            | map('extract', hostvars, 'prune_candidates')
            | select('defined')
            | flatten
          }}
        global_problem_containers: >-
          {{
            groups['docker_deployment_hosts']
            | map('extract', hostvars, 'problem_containers')
            | select('defined')
            | flatten
          }}
# ==============================================================================
# PLAY 9: Zusammenfassung & Log-Datei erstellen
# ==============================================================================
- name: "PLAY 9: Zusammenfassung & Log-Datei erstellen"
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    log_dir: "{{ playbook_dir }}/../../x/reports/docker"
    log_file: "{{ log_dir }}/deployment-{{ ansible_date_time.iso8601_basic_short }}.log"

  tasks:
    - name: "TASK 9.1: Log-Verzeichnis anlegen"
      ansible.builtin.file:
        path: "{{ log_dir }}"
        state: directory
        mode: '0755'

    - name: "TASK 9.2: Zusammenfassung generieren"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/summary_templates.j2"
        dest: "{{ log_file }}"
        mode: '0644'

    - name: "TASK 9.3: Zusammenfassung im Terminal anzeigen und auf Bestätigung warten"
      ansible.builtin.pause:
        prompt: |

          ======================================================================
          Deployment Zusammenfassung (Logfile-Inhalt):
          {{ lookup('file', log_file) }}
          Drücken Sie Enter, um fortzufahren.

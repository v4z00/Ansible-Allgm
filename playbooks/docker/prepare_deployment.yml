---
- name: Lokale Docker-Deployment-Struktur vorbereiten
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: Mindestens ein Docker-Deployment-Ziel pruefen
      ansible.builtin.assert:
        that: groups.get('docker_deployment_hosts', []) | length > 0
        fail_msg: "Kein Host mit Tag docker ohne deployment-exclude im Inventory."

    - name: Lokales Basisverzeichnis anlegen
      ansible.builtin.file:
        path: "{{ docker_local_base_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Lokales Hostverzeichnis je Deployment-Ziel anlegen
      ansible.builtin.file:
        path: "{{ docker_local_base_dir }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop: "{{ groups.get('docker_deployment_hosts', []) }}"

- name: Remote Docker-Deployment-Struktur vorbereiten
  hosts: docker_deployment_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Remote Basisverzeichnis anlegen
      ansible.builtin.file:
        path: "{{ docker_remote_base_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Docker und Compose-Verfuegbarkeit pruefen
      ansible.builtin.command: docker compose version
      changed_when: false

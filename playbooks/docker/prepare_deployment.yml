---
- name: Prepare local Docker deployment directories
  hosts: localhost
  vars_files: [vars/paths.yml]
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: Require at least one Docker deployment target
      ansible.builtin.assert:
        that: groups.get('docker_deployment_hosts', []) | length > 0
        fail_msg: "Kein Host mit Tag docker ohne deployment-exclude im Inventory."

    - name: Create the local base directory
      ansible.builtin.file:
        path: "{{ _docker_local_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Create a local host directory for each deployment target
      ansible.builtin.file:
        path: "{{ _docker_local_config_dir }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop: "{{ groups.get('docker_deployment_hosts', []) }}"

- name: Prepare remote Docker deployment directories
  hosts: docker_deployment_hosts
  vars_files: [vars/paths.yml]
  become: true
  gather_facts: false
  tasks:
    - name: Create the remote base directory
      ansible.builtin.file:
        path: "{{ _docker_remote_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Check Docker and Compose availability
      ansible.builtin.command: docker compose version
      changed_when: false

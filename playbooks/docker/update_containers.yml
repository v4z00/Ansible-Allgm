---
- name: "Docker Container Updates (Ansible Watchtower)"
  hosts: docker_deployment_hosts
  become: yes
  gather_facts: yes

  vars:
    # Remote configuration directory
    docker_host_config_dir: "{{ docker_remote_base_dir }}/{{ inventory_hostname }}"
    # Temporary report on the remote server
    summary_file: "/tmp/docker_update_summary.txt"

  tasks:
    - name: "Clean Summary File"
      copy:
        content: ""
        dest: "{{ summary_file }}"
        force: yes

    - name: "Find Docker Compose Files"
      find:
        paths: "{{ docker_host_config_dir }}"
        patterns: "{{ compose_file_patterns | default(docker_compose_file_patterns | default(['docker-compose.yml', 'docker-compose.yaml', 'compose.yml', 'compose.yaml'])) }}"
        recurse: yes
      register: compose_files

    - name: Require Compose files for the mandatory check
      ansible.builtin.assert:
        that:
          - compose_files.matched > 0
          - (compose_files.files | map(attribute='path') | map('dirname') | unique | length) == compose_files.matched
        fail_msg: Each stack requires exactly one Compose file. Check the Compose directories and file patterns.

    - name: Update images and wait for running or healthy services
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - "{{ item.path }}"
          - up
          - --detach
          - --pull
          - always
          - --wait
          - --wait-timeout
          - "180"
        chdir: "{{ item.path | dirname }}"
      loop: "{{ compose_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: stack_update
      changed_when: "'Recreated' in stack_update.stderr or 'Created' in stack_update.stderr"

    - name: Record changed stacks in the update report
      ansible.builtin.lineinfile:
        path: "{{ summary_file }}"
        line: "UPDATE: {{ item.item.path | dirname | basename }}"
      loop: "{{ stack_update.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.changed

    # ==============================================================================
    # Prune unused images.
    # ==============================================================================
    - name: "Prune Images and Log"
      shell: |
        # The -a flag includes unused tagged images.
        prune_output=$(docker image prune -a -f)
        
        # Match the Docker "Deleted Images:" output to determine whether anything changed.
        if echo "$prune_output" | grep -q "Deleted Images:"; then
             
             # Extract the value after 'Total reclaimed space: '.
             # Localized Docker output can omit this field.
             cleaned_size=$(echo "$prune_output" | grep "Total reclaimed space" | sed 's/Total reclaimed space: //')
             
             # Use a fallback when sed returns no size.
             if [ -z "$cleaned_size" ]; then cleaned_size="size unavailable"; fi

             # Append the result to the log.
             echo "CLEANED: $cleaned_size" >> {{ summary_file }}
             
             # Emit the change marker consumed by Ansible.
             echo "ANSIBLE_CHANGED"
        fi
      args:
        executable: /bin/bash
      register: prune_result
      # Report the task as changed when the script prints ANSIBLE_CHANGED.
      changed_when: "'ANSIBLE_CHANGED' in prune_result.stdout"

    # ==============================================================================
    # Fetch the report to the controller.
    # ==============================================================================
    - name: "Fetch Report to Management Server"
      fetch:
        src: "{{ summary_file }}"
        # Save the report locally under /tmp/docker_reports/HOSTNAME.txt.
        dest: "/tmp/docker_reports/{{ inventory_hostname }}.txt"
        flat: yes
        fail_on_missing: no

- name: Check Docker sources and networks on the updated hosts
  ansible.builtin.import_playbook: check_docker.yml

- name: Run the site-specific Portainer check
  ansible.builtin.import_playbook: check_portainer.yml

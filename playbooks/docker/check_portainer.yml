---
- name: Optionalen Portainer-TCP-Port vom Controller prüfen
  hosts: docker_deployment_hosts
  gather_facts: false
  tasks:
    - name: Portainer-Schalter als YAML-Boolean prüfen
      ansible.builtin.assert:
        that: (portainer_check_enabled | default(false)) is boolean
        fail_msg: portainer_check_enabled muss true oder false sein.

    - name: Konfigurierten Portainer-Port erreichen
      when: portainer_check_enabled | default(false)
      delegate_to: localhost
      become: false
      ansible.builtin.wait_for:
        host: "{{ portainer_check_host | default(ansible_host | default(inventory_hostname)) }}"
        port: "{{ portainer_check_port | default(9443) }}"
        timeout: "{{ portainer_check_timeout | default(5) }}"
        state: started

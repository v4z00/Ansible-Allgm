---
- name: Verify the local controller installation
  hosts: controller_smoke
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_remote_tmp: "{{ playbook_dir }}/../.local/ansible/smoke"
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Run Python through Ansible on the controller
      ansible.builtin.ping:
    - name: Validate the inventory and local group variables
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'controller-smoke'
          - features is mapping
          - features.baseline is boolean

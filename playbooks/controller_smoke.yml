---
- name: Prüfe die Controllerinstallation lokal
  hosts: controller_smoke
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_remote_tmp: "{{ playbook_dir }}/../.local/ansible/smoke"
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Python am Controller über Ansible erreichen
      ansible.builtin.ping:
    - name: Inventory und lokale Gruppenvariablen prüfen
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'controller-smoke'
          - features is mapping
          - features.baseline is boolean

---
- name: SSS auf dem Ansible-Host vorbereiten
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars_files:
    - config.yml
    - treuhaender.yml
  tasks:
    - name: Unterstützte Plattform prüfen
      ansible.builtin.assert:
        that: ansible_facts.os_family == 'Debian'
        fail_msg: Dieser Stack benötigt Debian oder Ubuntu auf dem Ansible-Host.

    - name: Offline-Werkzeuge installieren
      ansible.builtin.apt:
        name: [ssss, python3]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Geschützte Verzeichnisse außerhalb des Ansible-Baums anlegen
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - /root/rescue
        - /root/rescue/SSS
        - /root/rescue/SSS/bin
        - /root/rescue/SSS/offline
        - /root/rescue/SSS/ausgaben

    - name: Generator installieren
      ansible.builtin.copy:
        src: files/generate.py
        dest: /root/rescue/SSS/bin/generate.py
        owner: root
        group: root
        mode: '0700'

    - name: Offline-Wiederherstellung installieren
      ansible.builtin.copy:
        src: files/recover.py
        dest: /root/rescue/SSS/offline/recover.py
        owner: root
        group: root
        mode: '0700'

    - name: Startskript für die HTML-Oberfläche installieren
      ansible.builtin.copy:
        src: files/start-html.sh
        dest: /root/rescue/SSS/offline/start-html.sh
        owner: root
        group: root
        mode: '0700'

    - name: Installationshilfe für Voraussetzungen ablegen
      ansible.builtin.copy:
        src: files/install-voraussetzungen.sh
        dest: /root/rescue/SSS/offline/install-voraussetzungen.sh
        owner: root
        group: root
        mode: '0700'

    - name: Windows- und macOS-Starter ablegen
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/root/rescue/SSS/offline/{{ item }}"
        owner: root
        group: root
        mode: '0700'
      loop:
        - start-html.command
        - start-html.bat
        - start-html.ps1
        - install-voraussetzungen.ps1

    - name: Nicht geheime Konfiguration bereitstellen
      ansible.builtin.copy:
        content: "{{ {'settings': sss, 'people': treuhaender} | to_nice_json }}\n"
        dest: /root/rescue/SSS/config.json
        owner: root
        group: root
        mode: '0600'

    - name: HTML-Oberfläche für die Offline-Wiederherstellung installieren
      ansible.builtin.copy:
        src: files/notfall_entschluesselung.html
        dest: /root/rescue/SSS/offline/notfall_entschluesselung.html
        owner: root
        group: root
        mode: '0600'

    - name: Bedienungsanleitung ablegen
      ansible.builtin.copy:
        src: README.md
        dest: /root/rescue/SSS/README.md
        owner: root
        group: root
        mode: '0600'

    - name: Ausführliche Anleitung für Vertrauenspersonen ablegen
      ansible.builtin.copy:
        src: BEDIENUNGSANLEITUNG.md
        dest: /root/rescue/SSS/offline/BEDIENUNGSANLEITUNG.md
        owner: root
        group: root
        mode: '0600'

    - name: Plattform-Startanleitung ablegen
      ansible.builtin.copy:
        src: START-HIER.md
        dest: /root/rescue/SSS/offline/START-HIER.md
        owner: root
        group: root
        mode: '0600'

    - name: Nächster Schritt
      ansible.builtin.debug:
        msg: 'Generieren: sudo python3 /root/rescue/SSS/bin/generate.py (interaktiv, außerhalb Ansible)'

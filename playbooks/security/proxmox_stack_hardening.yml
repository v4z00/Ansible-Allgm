---
- name: Bind the Proxmox web interface to the management IP
  hosts: proxmox_gui_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Bind pveproxy to the inventory address
      ansible.builtin.lineinfile:
        path: /etc/default/pveproxy
        regexp: '^LISTEN_IP='
        line: 'LISTEN_IP="{{ ansible_host }}"'
        create: true
        owner: root
        group: root
        mode: '0644'
      notify: Restart pveproxy
  handlers:
    - name: Restart pveproxy
      listen: PVEProxy neu starten
      ansible.builtin.service:
        name: pveproxy
        state: restarted

- name: Restrict the PBS port to the storage network
  hosts: proxmox_backup_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Install persistent iptables support
      ansible.builtin.apt:
        name: iptables-persistent
        state: present

    - name: Allow configured sources to reach the PBS port
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: '8007'
        source: "{{ item }}"
        jump: ACCEPT
        action: insert
      loop: "{{ pbs_allowed_sources }}"

    - name: Drop other requests to the PBS storage IP
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: '8007'
        destination: "{{ pbs_storage_ip }}"
        jump: DROP

    - name: Persist firewall rules
      ansible.builtin.command: netfilter-persistent save
      changed_when: true

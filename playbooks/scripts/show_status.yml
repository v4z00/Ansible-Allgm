---
- name: Show the last recorded result for each local job
  hosts: all_linux_systems
  gather_facts: false
  become: true
  become_user: "{{ script_jobs_owner | default('root') }}"
  tasks:
    - name: Require an explicit host selection
      ansible.builtin.assert:
        that: ansible_limit | default('') | trim | length > 0
        fail_msg: Fuer die Statusabfrage --limit ZIEL angeben.
    - name: Query the installed local status helper
      ansible.builtin.command:
        argv:
          - "{{ script_jobs_target_root | default(script_path | default('/scripte')) }}/bin/job-status"
          - --db
          - "{{ script_jobs_database_path | default('/var/lib/script-jobs/jobs.sqlite3') }}"
      register: local_job_status
      changed_when: false
      failed_when: false
      ignore_unreachable: true
    - name: Show the latest results
      ansible.builtin.debug:
        msg: "{{ local_job_status.stdout_lines | default([]) }}"
      when: local_job_status.rc | default(255) == 0
    - name: Report a missing or unreachable result store
      ansible.builtin.assert:
        that: local_job_status.rc | default(255) == 0
        fail_msg: Host nicht erreichbar oder lokale Ergebnisablage/Statushelfer noch nicht verfuegbar.

- name: Read the last Windows job states without executing jobs
  hosts: all_windows_systems
  gather_facts: false
  become: false
  tasks:
    - name: Require an explicit Windows target selection
      ansible.builtin.assert:
        that: ansible_limit | default('') | trim | length > 0
    - name: Verify Windows authentication prerequisites
      ansible.builtin.include_role:
        name: windows_connection_guard
    - name: Query the installed read-only Windows status library
      ansible.windows.win_powershell:
        script: |
          param([string]$Root,[string]$Database,[string]$Sqlite)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module (Join-Path $Root 'lib/ScriptLibrary.psm1') -DisableNameChecking
          $store = Open-JobStore -Database $Database -Sqlite $Sqlite
          $Ansible.Result = @(Get-JobState -Store $store | Select-Object source,job,status,started,exit_code)
        parameters:
          Root: "{{ windows_script_root | default('C:\\Scripte') }}"
          Database: "{{ windows_job_database | default('C:\\ProgramData\\ScriptJobs\\jobs.sqlite3') }}"
          Sqlite: "{{ windows_sqlite_exe | default('C:\\Scripte\\runtime\\sqlite3.exe') }}"
      register: local_windows_status
      no_log: true
    - name: Show only recorded Windows job identities and states
      ansible.builtin.debug:
        msg: "{{ local_windows_status.result }}"

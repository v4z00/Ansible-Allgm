---
- name: Aggregate job results and confirm delivery by channel
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    SCRIPT_JOBS_CALLBACK: '0'
  vars:
    job_root: "{{ playbook_dir }}/../.."
    job_failures_only: "{{ script_jobs_failures_only | default(false) | bool }}"
    job_query_targets: >-
      {{ script_jobs_query_override | default(
         (job_controller.failure_targets | default(job_controller.targets, true)) if job_failures_only
         else (script_jobs_targets | default(job_controller.targets))) }}
  tasks:
    - name: Read the local controller configuration
      ansible.builtin.include_vars:
        file: "{{ script_jobs_controller_config_file | default(job_root ~ '/config/script_jobs_controller.json') }}"
        name: job_controller
      no_log: true
    - name: Query results over existing inventory connections
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", "{{ job_root }}/scripts/job_console.py", --project, "{{ job_root }}", --config, "{{ script_jobs_controller_config_file | default(job_root ~ '/config/script_jobs_controller.json') }}", --db, "{{ job_controller.database }}", --limit, "{{ job_query_targets }}", collect]
      register: job_collect
      changed_when: false
      failed_when: job_collect.rc not in [0, 1]
      no_log: true
    - name: Prepare private delivery settings
      ansible.builtin.tempfile:
        state: file
        prefix: job-notify-
      register: job_notify_file
    - name: Send the summary
      block:
        - name: Use existing local channel settings
          ansible.builtin.copy:
            content: "{{ {'EMAIL': script_jobs_mail_to | default(''), 'BOT_TOKEN': telegram_bot_token | default(''), 'CHAT_ID': telegram_chat_id | default(''), 'TELEGRAM_VALIDATE_CERTS': (tls_validate_certs | default({})).get('telegram_notification', true) | bool, 'REPORT_LABELS': script_jobs_report_labels | default(job_controller.labels | default({})), 'SEPARATE_FAILURE_JOBS': job_controller.separate_failure_jobs | default([]), 'SMTP_HOST': script_jobs_smtp.host | default(''), 'SMTP_PORT': script_jobs_smtp.port | default(587), 'SMTP_TLS': script_jobs_smtp.tls | default('starttls'), 'SMTP_AUTH': script_jobs_smtp.auth | default('none'), 'SMTP_FROM': script_jobs_smtp.sender | default(''), 'SMTP_USERNAME': script_jobs_smtp.username | default(''), 'SMTP_PASSWORD': script_jobs_smtp.password | default('')} | to_json }}"
            dest: "{{ job_notify_file.path }}"
            mode: '0600'
          no_log: true
        - name: Send the selected reports from the controller
          ansible.builtin.command:
            argv: ["{{ ansible_playbook_python }}", "{{ job_root }}/artifacts/script-library/bin/script-jobs", --db, "{{ job_controller.database }}", report, --category, "{{ item }}", --config, "{{ job_notify_file.path }}"]
          loop: "{{ (['job-failure'] if (job_controller.separate_failure_jobs | default([]) | length > 0) else []) + ([] if job_failures_only else ['general', 'vzdump']) }}"
          register: job_report_send
          failed_when: false
          no_log: true
      always:
        - name: Remove the temporary delivery file
          ansible.builtin.file:
            path: "{{ job_notify_file.path }}"
            state: absent
    - name: Report an incomplete query after sending the error report
      ansible.builtin.assert:
        that: job_collect.rc == 0
        fail_msg: Zusammenfassung wurde verarbeitet, aber nicht alle Hosts konnten abgefragt werden.
    - name: Report unconfirmed delivery
      ansible.builtin.assert:
        that: job_report_send.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: Mindestens ein zentraler Bericht konnte nicht vollstaendig zugestellt werden; er bleibt offen.

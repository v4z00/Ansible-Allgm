---
- name: Validate the Postfix configuration
  ansible.builtin.assert:
    that:
      - postfix_relay_host | length > 0
      - postfix_relay_user | length > 0
      - postfix_relay_password | length > 0
    fail_msg: "Postfix-Relay und Credentials zentral konfigurieren."
  no_log: true

- name: Install Postfix packages
  ansible.builtin.apt:
    name: [postfix, libsasl2-modules, mailutils]
    state: present

- name: Deploy Postfix main.cf
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Reload Postfix

- name: Determine the sender address for this host
  ansible.builtin.set_fact:
    postfix_sender_email: >-
      {{ postfix_sender_aliases.get(inventory_hostname, 'lxc') }}@{{ postfix_mail_domain }}

- name: Deploy the sender canonical map
  ansible.builtin.template:
    src: sender_canonical.j2
    dest: /etc/postfix/sender_canonical
    owner: root
    group: root
    mode: '0644'
  notify: Update the Postfix canonical map

- name: Write SASL credentials
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Update Postfix maps

- name: Enable Postfix
  ansible.builtin.systemd:
    name: postfix
    state: started
    enabled: true

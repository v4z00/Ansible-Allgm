---
- name: Update Postfix maps
  listen: Postfix-Maps aktualisieren
  ansible.builtin.command: postmap /etc/postfix/sasl_passwd
  notify: Reload Postfix

- name: Reload Postfix
  listen: Postfix neu laden
  ansible.builtin.systemd:
    name: postfix
    state: reloaded

- name: Update the Postfix canonical map
  listen: Postfix-Canonical-Map aktualisieren
  ansible.builtin.command: postmap /etc/postfix/sender_canonical
  notify: Reload Postfix

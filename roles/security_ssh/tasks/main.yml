---
- name: Validate additional SSH listen addresses
  ansible.builtin.assert:
    that:
      - (ssh_listen_addresses | default([]) | type_debug) == 'list'
    fail_msg: "ssh_listen_addresses muss eine YAML-Liste lokaler IP-Adressen sein."

- name: Check that additional SSH listen addresses are assigned locally
  ansible.builtin.assert:
    that:
      - item is string
      - item in ((ansible_all_ipv4_addresses | default([])) + (ansible_all_ipv6_addresses | default([])))
    fail_msg: >-
      SSH-Listenadresse {{ item }} ist keine auf {{ inventory_hostname }}
      erkannte lokale IP. Adresse zuerst am Zielhost einrichten und Facts neu lesen.
  loop: "{{ ssh_listen_addresses | default([]) }}"

- name: Validate the SSH authentication mode
  ansible.builtin.assert:
    that:
      - ansible_auth_mode in ['password_all', 'key_only', 'password_users_only']
    fail_msg: >-
      Ungueltiger ansible_auth_mode '{{ ansible_auth_mode | default('nicht gesetzt') }}'.
      Erlaubt sind password_all, key_only und password_users_only.

- name: Validate the break-glass password
  ansible.builtin.assert:
    that: ssh_breakglass_password | length > 0
    fail_msg: "ssh_breakglass_password fehlt in secrets.yml."
  when:
    - ssh_breakglass_enabled | bool
    - inventory_hostname not in ssh_breakglass_excluded_hosts
  no_log: true

- name: Create the break-glass user
  ansible.builtin.user:
    name: "{{ ssh_breakglass_user }}"
    uid: "{{ ssh_breakglass_uid }}"
    password: "{{ ssh_breakglass_password | password_hash('sha512', ssh_breakglass_password_salt) }}"
    update_password: always
    shell: /bin/rbash
    home: "{{ ssh_breakglass_home }}"
    create_home: true
    state: present
  when:
    - ssh_breakglass_enabled | bool
    - inventory_hostname not in ssh_breakglass_excluded_hosts
  no_log: true

- name: Create the restricted break-glass bin directory
  ansible.builtin.file:
    path: "{{ ssh_breakglass_home }}/bin"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - ssh_breakglass_enabled | bool
    - inventory_hostname not in ssh_breakglass_excluded_hosts

- name: Provide only su for break-glass access
  ansible.builtin.file:
    src: /bin/su
    dest: "{{ ssh_breakglass_home }}/bin/su"
    state: link
    owner: root
    group: root
    force: true
  when:
    - ssh_breakglass_enabled | bool
    - inventory_hostname not in ssh_breakglass_excluded_hosts

- name: Install the restricted break-glass profile
  ansible.builtin.copy:
    dest: "{{ ssh_breakglass_home }}/.bash_profile"
    owner: root
    group: root
    mode: '0644'
    content: |
      export PATH="$HOME/bin"
      readonly PATH
      export HISTFILE=/dev/null
  when:
    - ssh_breakglass_enabled | bool
    - inventory_hostname not in ssh_breakglass_excluded_hosts

- name: Create the SSH drop-in directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure sshd includes the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf$'
    line: 'Include /etc/ssh/sshd_config.d/*.conf'
    insertbefore: BOF

- name: Disable direct root login overrides in sshd_config
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '^([ \t]*)(PermitRootLogin[ \t]+.*)$'
    replace: '\1# \2'
  notify: Restart SSH

- name: Deploy the hardened SSH configuration
  ansible.builtin.template:
    src: 00-managed-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-managed-hardening.conf
    owner: root
    group: root
    mode: '0600'
    backup: true
  notify: Restart SSH

- name: Validate the complete SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Run SSH handlers now
  ansible.builtin.meta: flush_handlers

- name: Wait for connectivity after the SSH restart
  ansible.builtin.wait_for_connection:
    timeout: 30

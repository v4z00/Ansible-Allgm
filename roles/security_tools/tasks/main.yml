---
- name: Install PAM and security utilities
  ansible.builtin.apt:
    name:
      - libpam-tmpdir
      - debsums
      - apt-show-versions
      - needrestart
      - libpam-pwquality
      - rkhunter
    state: present

- name: Configure needrestart for unattended use
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/ansible.conf
    content: |
      # Managed by Ansible
      $nrconf{restart} = 'l';
    owner: root
    group: root
    mode: '0644'


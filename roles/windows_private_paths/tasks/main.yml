---
- name: Require explicit private Windows directories
  ansible.builtin.assert:
    that:
      - windows_private_paths | type_debug == 'list'
      - windows_private_paths | length > 0

- name: Protect only the selected local directories with fixed SIDs
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string]$Path)
      $ErrorActionPreference = 'Stop'
      if ($Path -notmatch '^[A-Za-z]:\\[^\r\n]+$' -or $Path -match '(?:^|[\\/])\.\.(?:[\\/]|$)') {
          throw 'An explicit local directory below the drive root is required.'
      }
      $exists = Test-Path -LiteralPath $Path
      if ($exists -and ((Get-Item -LiteralPath $Path -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) {
          throw 'Private directories must not be reparse points.'
      }
      $acl = New-Object Security.AccessControl.DirectorySecurity
      $acl.SetAccessRuleProtection($true, $false)
      $administrator = New-Object Security.Principal.SecurityIdentifier('S-1-5-32-544')
      $acl.SetOwner($administrator)
      foreach ($id in @('S-1-5-18','S-1-5-32-544')) {
          $sid = New-Object Security.Principal.SecurityIdentifier($id)
          $rule = New-Object Security.AccessControl.FileSystemAccessRule($sid,'FullControl','ContainerInherit,ObjectInherit','None','Allow')
          $acl.AddAccessRule($rule)
      }
      $sections = [Security.AccessControl.AccessControlSections]'Access,Owner'
      $desired = $acl.GetSecurityDescriptorSddlForm($sections)
      $current = if ($exists) { (Get-Acl -LiteralPath $Path).GetSecurityDescriptorSddlForm($sections) } else { '' }
      $Ansible.Changed = $current -ne $desired
      if ($Ansible.Changed -and -not $Ansible.CheckMode) {
          if (-not $exists) { $null = New-Item -ItemType Directory -Path $Path -Force }
          Set-Acl -LiteralPath $Path -AclObject $acl
      }
    parameters:
      Path: "{{ item }}"
  loop: "{{ windows_private_paths }}"

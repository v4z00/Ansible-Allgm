---
- name: Detect LXC for process accounting
  ansible.builtin.set_fact:
    accounting_is_lxc: >-
      {{
        proxmox_type | default('') == 'lxc'
        or inventory_hostname in groups.get('lxc_hosts', [])
        or inventory_hostname in groups.get('all_lxc_hosts', [])
        or ansible_virtualization_type | default('') in ['lxc', 'openvz']
      }}

- name: Install applicable accounting packages
  ansible.builtin.apt:
    name: "{{ ['sysstat'] if accounting_is_lxc | bool else ['auditd', 'acct', 'sysstat'] }}"
    state: present

- name: Enable sysstat data collection
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
  notify: Restart sysstat

- name: Enable sysstat
  ansible.builtin.systemd:
    name: sysstat
    state: started
    enabled: true

- name: Enable process accounting outside LXC
  ansible.builtin.systemd:
    name: acct
    state: started
    enabled: true
  when: not accounting_is_lxc | bool

- name: Enable auditd outside LXC
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
  when: not accounting_is_lxc | bool

- name: Report the accounting limitation on LXC
  ansible.builtin.debug:
    msg: "LXC erkannt: sysstat wird aktiviert; acct und auditd werden uebersprungen."
  when: accounting_is_lxc | bool


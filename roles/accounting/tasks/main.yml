---
- name: LXC-Umgebung fuer Accounting erkennen
  ansible.builtin.set_fact:
    accounting_is_lxc: >-
      {{
        proxmox_type | default('') == 'lxc'
        or inventory_hostname in groups.get('lxc_hosts', [])
        or inventory_hostname in groups.get('all_lxc_hosts', [])
        or ansible_virtualization_type | default('') in ['lxc', 'openvz']
      }}

- name: Passende Accounting-Pakete installieren
  ansible.builtin.apt:
    name: "{{ ['sysstat'] if accounting_is_lxc | bool else ['auditd', 'acct', 'sysstat'] }}"
    state: present

- name: Sysstat-Datensammlung aktivieren
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
  notify: Sysstat neu starten

- name: Sysstat aktivieren
  ansible.builtin.systemd:
    name: sysstat
    state: started
    enabled: true

- name: Prozess-Accounting nur ausserhalb von LXC aktivieren
  ansible.builtin.systemd:
    name: acct
    state: started
    enabled: true
  when: not accounting_is_lxc | bool

- name: Auditd nur ausserhalb von LXC aktivieren
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
  when: not accounting_is_lxc | bool

- name: Accounting-Einschraenkung fuer LXC dokumentieren
  ansible.builtin.debug:
    msg: "LXC erkannt: sysstat wird aktiviert; acct und auditd werden uebersprungen."
  when: accounting_is_lxc | bool


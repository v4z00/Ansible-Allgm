---
- name: Install Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Validate mail recipients for enabled notifications
  ansible.builtin.assert:
    that:
      - not (fail2ban_enable_notifications | bool) or (fail2ban_admin_email | default('') | length > 0)
      - not (fail2ban_enable_ticket_notifications | bool) or (fail2ban_ticket_email | default('') | length > 0)
    fail_msg: >-
      Fuer aktivierte Fail2ban-Mailbenachrichtigungen muss die passende
      Admin- beziehungsweise Ticketsystem-Adresse gesetzt sein.

- name: Install the silent mail action for ticket systems
  ansible.builtin.copy:
    dest: /etc/fail2ban/action.d/ticketsystem_silent_mail.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Includes]
      before = sendmail-whois-lines.conf

      [Definition]
      actionstart = /bin/true
      actionstop = /bin/true
      actioncheck = /bin/true
      actionunban = /bin/true
  notify: Restart Fail2ban
  when: fail2ban_enable_ticket_notifications | bool

- name: Remove the silent mail action when ticket notifications are disabled
  ansible.builtin.file:
    path: /etc/fail2ban/action.d/ticketsystem_silent_mail.conf
    state: absent
  notify: Restart Fail2ban
  when: not (fail2ban_enable_ticket_notifications | bool)

- name: Install the Proxmox VE filter
  ansible.builtin.copy:
    dest: /etc/fail2ban/filter.d/proxmox.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Definition]
      failregex = pvedaemon\[.*authentication failure; rhost=<HOST> user=.* msg=.*
      ignoreregex =
  when: inventory_hostname in fail2ban_proxmox_ve_hosts
  notify: Restart Fail2ban

- name: Install the Proxmox Backup filter
  ansible.builtin.copy:
    dest: /etc/fail2ban/filter.d/proxmox-backup.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Definition]
      failregex = proxmox-backup-api\[.*authentication failure; rhost=<HOST> user=.* msg=.*
      ignoreregex =
  when: inventory_hostname in fail2ban_proxmox_backup_hosts
  notify: Restart Fail2ban

- name: Deploy the Fail2ban configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart Fail2ban

- name: Enable Fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

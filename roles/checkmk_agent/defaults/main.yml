---
checkmk_agent_package_tmp: /tmp/check-mk-agent.deb
checkmk_plugin_base_dir: /usr/lib/check_mk_agent/plugins
checkmk_local_base_dir: /usr/lib/check_mk_agent/local
checkmk_windows_agent_package_src: "{{ playbook_dir }}/../artifacts/checkmk/check_mk_agent.msi"
checkmk_windows_agent_package_tmp: 'C:\Windows\Temp\check_mk_agent.msi'
checkmk_windows_agent_controller: 'C:\Program Files (x86)\checkmk\service\cmk-agent-ctl.exe'
checkmk_windows_agent_service: CheckmkService
checkmk_windows_agent_port: 6556
checkmk_windows_plugin_dir: 'C:\ProgramData\checkmk\agent\plugins'
checkmk_windows_plugins_src_dir: "{{ playbook_dir }}/../artifacts/checkmk/windows/plugins"
checkmk_windows_plugins: []
checkmk_linux_base_plugins:
  - {name: mk_apt, interval: 3600}
  - {name: mk_logwatch.py, interval: null}
  - {name: mk_inventory.linux, interval: 3600}
  - {name: netstat.linux, interval: 300}
checkmk_docker_plugins:
  - {name: mk_docker.py, interval: null}
checkmk_smart_plugins:
  - {name: smart, interval: 300}
checkmk_cups_plugins:
  - {name: mk_cups_queues, interval: null}
checkmk_webserver_plugins:
  - {name: nginx_status.py, interval: null}
  - {name: apache_status.py, interval: null}
checkmk_database_plugins:
  - {name: mk_mysql, interval: null}
  - {name: mk_postgres.py, interval: null}
  - {name: mk_redis, interval: null}


---
- name: Configure the time zone
  community.general.timezone:
    name: "{{ system_timezone }}"

- name: Detect LXC and other containers
  ansible.builtin.set_fact:
    baseline_is_container: >-
      {{
        proxmox_type | default('') == 'lxc'
        or inventory_hostname in groups.get('lxc_hosts', [])
        or ansible_virtualization_type | default('') in ['docker', 'lxc', 'openvz', 'podman', 'containerd']
      }}

- name: Configure Chrony on virtual machines and physical hosts
  when: not baseline_is_container | bool
  block:
    - name: Install Chrony
      ansible.builtin.apt:
        name: chrony
        state: present

    - name: Disable competing time services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - systemd-timesyncd
        - ntp
        - ntpd
      failed_when: false

    - name: Deploy the Chrony configuration
      ansible.builtin.template:
        src: chrony.conf.j2
        dest: /etc/chrony/chrony.conf
        owner: root
        group: root
        mode: '0644'
        backup: true
      notify: Restart Chrony

    - name: Enable Chrony
      ansible.builtin.systemd:
        name: chrony
        state: started
        enabled: true

- name: Report how LXC obtains the host time
  ansible.builtin.debug:
    msg: "LXC/Container: Zeitzone gesetzt; die Uhr wird vom Host bereitgestellt."
  when: baseline_is_container | bool


---
- name: Read the configured controller key locally
  ansible.builtin.set_fact:
    bootstrap_public_key: >-
      {{ lookup('ansible.builtin.file', bootstrap_public_key_file) }}
  no_log: true

- name: Install the controller key for the Ansible user
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ bootstrap_public_key }}"
    state: present
  no_log: true

- name: Install existing site admin keys for root
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
    state: present
  loop: "{{ root_allowed_keys }}"
  no_log: true

- name: List local users with UID 1000 or higher
  ansible.builtin.shell: "awk -F: '$3 >= 1000 {print $1}' /etc/passwd"
  register: bootstrap_non_root_users
  changed_when: false
  failed_when: false

- name: Remove site admin keys from non-root accounts
  ansible.posix.authorized_key:
    user: "{{ item.0 }}"
    key: "{{ item.1 }}"
    state: absent
  with_nested:
    - "{{ bootstrap_non_root_users.stdout_lines | default([]) }}"
    - "{{ root_allowed_keys }}"
  no_log: true

- name: Check key authentication before disabling passwords
  ansible.builtin.assert:
    that:
      - bootstrap_public_key | length > 40
    fail_msg: "Der konfigurierte Public Key ist leer oder ungueltig."
  when: bootstrap_disable_password_auth_after_key | bool

- name: Disable password authentication when explicitly approved
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/01-key-only.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  notify: Reload SSH
  when: bootstrap_disable_password_auth_after_key | bool

- name: Validate the SSH configuration before reload
  ansible.builtin.command: sshd -t
  changed_when: false
  when: bootstrap_disable_password_auth_after_key | bool

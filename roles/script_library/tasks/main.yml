---
- name: Explizite Hostauswahl und absoluten Librarypfad verlangen
  ansible.builtin.assert:
    that:
      - ansible_limit | default('') | trim | length > 0
      - script_library_root is match('^/[^\n]+$')
      - "'..' not in script_library_root.split('/')"
      - script_library_root != '/'
- name: Vorhandenen Librarypfad pruefen
  ansible.builtin.stat:
    path: "{{ script_library_root }}/lib"
    follow: false
  register: script_library_target
- name: Verknuepfungen und Dateien schuetzen
  ansible.builtin.assert:
    that: not script_library_target.stat.exists or (script_library_target.stat.isdir | default(false) and not script_library_target.stat.islnk | default(false))
- name: Private Libraryverzeichnisse anlegen
  ansible.builtin.file:
    path: "{{ script_library_root }}/{{ item }}"
    state: directory
    owner: "{{ script_library_owner }}"
    group: "{{ script_library_group }}"
    mode: '0700'
  loop: [lib, lib/common, lib/data, lib/python, bin]
- name: Komplette gemeinsame Library verteilen
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ script_library_root }}/lib/{{ item | regex_replace('^.*/script-library/lib/', '') }}"
    owner: "{{ script_library_owner }}"
    group: "{{ script_library_group }}"
    mode: '0600'
  loop: "{{ [role_path ~ '/../../artifacts/script-library/lib/load.sh'] + lookup('ansible.builtin.fileglob', role_path ~ '/../../artifacts/script-library/lib/common/*.sh', wantlist=True) + lookup('ansible.builtin.fileglob', role_path ~ '/../../artifacts/script-library/lib/python/*.py', wantlist=True) + lookup('ansible.builtin.fileglob', role_path ~ '/../../artifacts/script-library/lib/data/*.json', wantlist=True) }}"
  loop_control:
    label: "{{ item | basename }}"
- name: Jobhelfer installieren
  ansible.builtin.copy:
    src: "{{ role_path }}/../../artifacts/script-library/bin/script-jobs"
    dest: "{{ script_library_root }}/bin/script-jobs"
    owner: "{{ script_library_owner }}"
    group: "{{ script_library_group }}"
    mode: '0700'

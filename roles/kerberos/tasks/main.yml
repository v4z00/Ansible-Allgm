---
- name: Validate Kerberos configuration
  ansible.builtin.assert:
    that:
      - kerberos_realm | trim | length > 0
      - kerberos_kdcs | length > 0
      - kerberos_admin_server | trim | length > 0
    fail_msg: "Kerberos ist aktiv, aber Realm, KDCs oder Admin-Server fehlen."

- name: Install the Kerberos client
  ansible.builtin.package:
    name: "{{ 'krb5-user' if ansible_os_family == 'Debian' else 'krb5-workstation' }}"
    state: present
  when: ansible_os_family in ['Debian', 'RedHat']

- name: Deploy the Kerberos configuration
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: '0644'

- name: Fix the Debian and Proxmox CIFS upcall
  ansible.builtin.lineinfile:
    path: /etc/request-key.d/cifs.spnego.conf
    regexp: '^create\\s+cifs\\.spnego\\s+\\*\\s+\\*\\s+/usr/sbin/cifs\\.upcall'
    line: 'create cifs.spnego * * /usr/sbin/cifs.upcall -c %k'
    create: true
    owner: root
    group: root
    mode: '0644'
  when:
    - ansible_os_family == 'Debian'
    - kerberos_fix_cifs_upcall | bool

---
- name: Validate the environment signing settings
  ansible.builtin.include_tasks: validate.yml
- name: Require an explicit signing source kind and path
  ansible.builtin.assert:
    that:
      - windows_signing_source_kind in ['library', 'code-root', 'manifest']
      - windows_signing_source_path is match('^/[^\r\n]+$')
  when: windows_signing_effective.enabled
- name: Prepare a signed code bundle only for enabled environments
  block:
    - name: Configure public publisher trust on this execution host
      ansible.builtin.include_tasks: trust.yml
      when: not windows_signing_effective.use_presigned_cache
    - name: Prepare the reviewed code payload without private keys
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/../../scripts/windows_signing_bundle.py"
          - prepare
          - "--{{ windows_signing_source_kind }}"
          - "{{ windows_signing_source_path }}"
          - --certificate
          - "{{ windows_signing_effective.public_certificate_src }}"
          - --cache
          - "{{ windows_signing_effective.cache_root }}"
          - --timestamp-server
          - "{{ windows_signing_effective.timestamp_server }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_shell_type: sh
      register: windows_signing_prepared
      changed_when: false
      no_log: true
    - name: Keep the explicit signing batch in private play memory
      ansible.builtin.set_fact:
        windows_signing_bundle: "{{ windows_signing_prepared.stdout | from_json }}"
      no_log: true
    - name: Sign and retrieve artifacts using the configured signer process
      ansible.builtin.include_tasks: sign_on_host.yml
      when: not windows_signing_effective.use_presigned_cache
    - name: Verify signed bytes and their source mapping on the controller
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/../../scripts/windows_signing_bundle.py"
          - verify
          - --directory
          - "{{ windows_signing_bundle.signed_root }}"
          - --expected
          - "{{ windows_signing_bundle.source_manifest }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_shell_type: sh
      changed_when: false
      no_log: true
    - name: Configure public publisher trust after checking the presigned cache
      ansible.builtin.include_tasks: trust.yml
      when: windows_signing_effective.use_presigned_cache
    - name: Select verified signed bytes for deployment
      ansible.builtin.set_fact:
        windows_signed_bundle_root: "{{ windows_signing_bundle.signed_root }}"
      no_log: true
  when: windows_signing_effective.enabled and not ansible_check_mode

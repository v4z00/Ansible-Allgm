---
- name: Validate the environment signing settings
  ansible.builtin.include_tasks: validate.yml
- name: Prepare a signed library only for enabled environments
  block:
    - name: Configure public publisher trust on this execution host
      ansible.builtin.include_tasks: trust.yml
    - name: Prepare the reviewed library payload without private keys
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/../../scripts/windows_signing_bundle.py"
          - prepare
          - --library
          - "{{ role_path }}/../../artifacts/script-library"
          - --certificate
          - "{{ windows_signing_effective.public_certificate_src }}"
          - --cache
          - "{{ windows_signing_effective.cache_root }}"
          - --timestamp-server
          - "{{ windows_signing_effective.timestamp_server }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_shell_type: sh
      register: windows_signing_prepared
      changed_when: false
      no_log: true
    - name: Keep the explicit signing batch in private play memory
      ansible.builtin.set_fact:
        windows_signing_bundle: "{{ windows_signing_prepared.stdout | from_json }}"
      no_log: true
    - name: Create protected batch directories on the configured signer
      ansible.builtin.include_role:
        name: windows_private_paths
        apply:
          delegate_to: "{{ windows_signing_effective.host }}"
          vars:
            ansible_become: true
            ansible_become_method: runas
            ansible_become_user: SYSTEM
      vars:
        windows_private_paths:
          - "{{ windows_signing_effective.work_root }}"
          - "{{ windows_signing_effective.work_root }}\\batches"
          - "{{ windows_signing_effective.work_root }}\\batches\\{{ windows_signing_bundle.batch_id }}"
    - name: Sign the exact batch under a signer-local mutex
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.template', 'sign-bundle.ps1.j2') }}"
        parameters:
          Root: "{{ windows_signing_effective.work_root }}\\batches\\{{ windows_signing_bundle.batch_id }}"
          Payload: "{{ windows_signing_bundle | to_json }}"
          StoreLocation: "{{ windows_signing_effective.store_location }}"
          TimestampServer: "{{ windows_signing_effective.timestamp_server }}"
      delegate_to: "{{ windows_signing_effective.host }}"
      vars:
        ansible_become: true
        ansible_become_method: runas
        ansible_become_user: SYSTEM
      register: windows_signing_result
      no_log: true
    - name: Require verified signer output before retrieving artifacts
      ansible.builtin.assert:
        that: windows_signing_result.result.ready
        fail_msg: The configured signer did not produce a verified signed library.
    - name: Retrieve only signed code and its receipt
      ansible.builtin.fetch:
        src: "{{ windows_signing_effective.work_root }}\\batches\\{{ windows_signing_bundle.batch_id }}\\{{ item | replace('/', '\\') }}"
        dest: "{{ windows_signing_bundle.signed_root }}/{{ item }}"
        flat: true
      delegate_to: "{{ windows_signing_effective.host }}"
      vars:
        ansible_become: true
        ansible_become_method: runas
        ansible_become_user: SYSTEM
      loop: "{{ windows_signing_bundle.files | map(attribute='path') | list + ['signed-manifest.json'] }}"
      no_log: true
    - name: Verify fetched bytes and their source mapping on the controller
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/../../scripts/windows_signing_bundle.py"
          - verify
          - --directory
          - "{{ windows_signing_bundle.signed_root }}"
          - --expected
          - "{{ windows_signing_bundle.source_manifest }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_shell_type: sh
      changed_when: false
      no_log: true
    - name: Select verified signed bytes for library deployment
      ansible.builtin.set_fact:
        windows_library_signed_root: "{{ windows_signing_bundle.signed_root }}"
      no_log: true
  when: windows_signing_effective.enabled and not ansible_check_mode

---
- name: Sign the common library through the shared bundle workflow
  ansible.builtin.include_tasks: bundle.yml
  vars:
    windows_signing_source_kind: library
    windows_signing_source_path: "{{ role_path }}/../../artifacts/script-library"
- name: Keep the common library deployment interface
  ansible.builtin.set_fact:
    windows_library_signed_root: "{{ windows_signed_bundle_root }}"
  when: windows_signing_effective.enabled and not ansible_check_mode
